name: Promote M105-106 Character Pairs

on:
  push:
    branches: [main]
    paths:
      - "tools/promote-m105-106-character.py"
      - ".github/workflows/promote-m105-106-character.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-m105-106-character
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote exact candidate bytes
        run: python tools/promote-m105-106-character.py
      - name: Commit formal assets and ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character/combo character-assets/config/assets_manifest.json character-assets/prototypes/luna_say_maybe_105_106
          git diff --cached --quiet && exit 0
          git commit -m "character: promote M105-106 formal pairs"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
