name: Drum Chaos QA
on:
  push:
    branches: [main]
    paths: ['site/live-drum-engine.js','site/app.js','tools/drum-chaos-browser-qa.mjs','.github/workflows/drum-chaos-qa.yml']
  workflow_dispatch:
jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 -d site >/tmp/http.log 2>&1 &
      - run: node tools/drum-chaos-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: drum-chaos-qa, path: qa/runtime-audio/}
