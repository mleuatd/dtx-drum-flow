name: Drum Audio Integrity QA
on:
  push:
    branches: [main]
    paths:
      - 'site/live-drum-engine.js'
      - 'site/drum-note-sound-map.js'
      - 'site/app.js'
      - 'tools/drum-audio-integrity-qa.py'
      - '.github/workflows/drum-audio-integrity-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy soundfile requests
      - run: python tools/drum-audio-integrity-qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: drum-audio-integrity-qa
          path: qa/audio-integrity/
