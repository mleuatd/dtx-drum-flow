name: DMR009 photo-reference bone-local one-image build

on:
  push:
    branches: [main]
    paths:
      - "character-assets/generation-trials/dmr009-neutral-skeleton-v1/REQUEST.json"

permissions:
  contents: write

concurrency:
  group: dmr009-neutral-skeleton-one-image
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/character_layers/requirements.txt
      - run: pip install --disable-pip-version-check -r tools/character_layers/requirements.txt
      - name: Build exactly one DMR009 hit candidate from photo-reference constraints and approved donors
        run: python tools/character_layers/build_dmr009_neutral_skeleton.py
      - name: Guard one-image scope
        shell: bash
        run: |
          test -f character-assets/generation-trials/dmr009-neutral-skeleton-v1/DMR009_bd_hh_rf_r_hit_candidate_neutral_skeleton_v1.png
          test -f character-assets/generation-trials/dmr009-neutral-skeleton-v1/DMR009_fixed_drum_composite_v1.png
          test -f character-assets/generation-trials/dmr009-neutral-skeleton-v1/dmr009_attempt_20260921_v4_neutral_skeleton.json
          git status --porcelain | grep -q 'character-assets/generation-trials/dmr009-neutral-skeleton-v1/'
          if git status --porcelain | grep 'character-assets/layers/character/' | grep '\\.png$'; then
            echo "formal/runtime image modification is forbidden in this one-image candidate build"; exit 1
          fi
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/generation-trials/dmr009-neutral-skeleton-v1 character-assets/versions/one-by-one-qa/CURRENT_STATUS.json CHANGELOG.md
          git commit -m "trial: build DMR009 photo-reference bone-local hit candidate"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: dmr009-photo-reference-bone-local-evidence
          path: character-assets/generation-trials/dmr009-neutral-skeleton-v1/
          retention-days: 30
