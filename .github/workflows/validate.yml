name: validate

on:
  push:
    paths-ignore:
      - "character-assets/edit-workspaces/**"
      - "character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json"
      - "character-assets/prototypes/luna_say_maybe_16m/HOLD_REPAIR_PLAYBOOK.json"
      - "WORK_SYNC.md"
      - ".github/*trigger*.txt"
      - ".github/*promote*.txt"
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify validation scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "site/app.js" > /tmp/changed-files.txt
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt || echo "site/app.js" > /tmp/changed-files.txt
          fi
          node tools/classify-validation-scope.mjs /tmp/changed-files.txt /tmp/validation-scope.json
          node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/validation-scope.json","utf8"));
          for(const [k,v] of Object.entries(j.run)) fs.appendFileSync(process.env.GITHUB_OUTPUT,k+"="+v+"\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"scope="+j.scope+"\n");
          NODE
      - name: Evidence-only fast path
        if: steps.scope.outputs.scope == 'EVIDENCE_FAST'
        run: echo "Evidence/ledger-only commit; product validation intentionally skipped."
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.setupToolchains == 'true'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.setupToolchains == 'true'
        with:
          node-version: "20"
      - name: Install basic audio dependencies
        if: steps.scope.outputs.installAudioDeps == 'true'
        run: pip install --disable-pip-version-check -r tools/audio_pipeline/requirements.txt
      - name: Python syntax
        if: steps.scope.outputs.syntax == 'true'
        run: python -m py_compile tools/audio_pipeline/pipeline.py tools/audio_pipeline/evaluate.py tools/audio_pipeline/realign_existing_midi.py tools/audio_pipeline/video_chart_extractor.py tools/songsterr_gp_to_chart.py tools/chart_validation.py tools/validate_luna_full_song_planning.py tools/validate_production_pipeline.py tools/character_candidate_qa.py tools/build-character-qa-preview.py tools/character_image_diff_metrics.py
      - name: Browser JavaScript syntax
        if: steps.scope.outputs.syntax == 'true'
        run: |
          node --check site/app.js
          node --check site/character-prototype.js
          node --check site/parsers.js
          node --check site/audio-analysis.js
          node --check site/original-audio.js
      - name: Pipeline CLI smoke test
        if: steps.scope.outputs.audioTests == 'true'
        run: |
          python tools/audio_pipeline/pipeline.py --help
          python tools/audio_pipeline/evaluate.py --help
      - name: Synthetic audio timing tests
        if: steps.scope.outputs.audioTests == 'true'
        working-directory: tools/audio_pipeline
        run: python test_synthetic.py
      - name: Oshi sketch smoke test
        if: steps.scope.outputs.oshiSmoke == 'true'
        run: node tools/oshi_sketch_smoke.js
      - name: FINAL chart validation and Luna regression
        if: steps.scope.outputs.chartValidation == 'true'
        run: python tools/chart_validation.py
      - name: Luna full-song planning validation
        if: steps.scope.outputs.planningValidation == 'true'
        run: python tools/validate_luna_full_song_planning.py
      - name: Luna limb authority / immutable chart validation
        if: steps.scope.outputs.setupToolchains == 'true'
        run: node tools/validate-luna-limb-authority.mjs
      - name: Luna limb generator validation
        if: steps.scope.outputs.setupToolchains == 'true'
        run: node tools/generate-luna-full-limbs.mjs
      - name: Production pipeline validation
        if: steps.scope.outputs.pipelineValidation == 'true'
        run: python tools/validate_production_pipeline.py
      - name: Production pipeline smoke tests
        if: steps.scope.outputs.pipelineSmoke == 'true'
        run: |
          node tools/build-next-asset-queue.mjs /tmp/next-assets.json
          node tools/luna-production-path.mjs 1 8 /tmp/fast.json
          grep -q 'FAST_PATH' /tmp/fast.json
      - name: UI contract checks
        if: steps.scope.outputs.uiContract == 'true'
        run: python tools/ui_contract_test.py
