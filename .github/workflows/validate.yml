name: validate

permissions:
  contents: write

on:
  push:
    paths-ignore:
      - "character-assets/edit-workspaces/**"
      - "character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json"
      - "character-assets/prototypes/luna_say_maybe_16m/HOLD_REPAIR_PLAYBOOK.json"
      - "WORK_SYNC.md"
      - ".github/*trigger*.txt"
      - ".github/*promote*.txt"
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify validation scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "site/app.js" > /tmp/changed-files.txt
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt || echo "site/app.js" > /tmp/changed-files.txt
          fi
          node tools/classify-validation-scope.mjs /tmp/changed-files.txt /tmp/validation-scope.json
          node - <<'NODE'
          const fs=require("fs");
          const j=JSON.parse(fs.readFileSync("/tmp/validation-scope.json","utf8"));
          for(const [k,v] of Object.entries(j.run)) fs.appendFileSync(process.env.GITHUB_OUTPUT,k+"="+v+"\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"scope="+j.scope+"\n");
          NODE
      - name: Evidence-only fast path
        if: steps.scope.outputs.scope == 'EVIDENCE_FAST'
        run: echo "Evidence/ledger-only commit; product validation intentionally skipped."
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.setupToolchains == 'true'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.setupToolchains == 'true'
        with:
          node-version: "20"
      - name: Install basic audio dependencies
        if: steps.scope.outputs.installAudioDeps == 'true'
        run: pip install --disable-pip-version-check -r tools/audio_pipeline/requirements.txt
      - name: Python syntax
        if: steps.scope.outputs.syntax == 'true'
        run: python -m py_compile tools/audio_pipeline/pipeline.py tools/audio_pipeline/evaluate.py tools/audio_pipeline/realign_existing_midi.py tools/audio_pipeline/video_chart_extractor.py tools/songsterr_gp_to_chart.py tools/chart_validation.py tools/validate_luna_full_song_planning.py tools/validate_production_pipeline.py tools/character_candidate_qa.py tools/build-character-qa-preview.py tools/character_image_diff_metrics.py
      - name: Browser JavaScript syntax
        if: steps.scope.outputs.syntax == 'true'
        run: |
          node --check site/app.js
          node --check site/character-prototype.js
          node --check site/parsers.js
          node --check site/audio-analysis.js
          node --check site/original-audio.js
      - name: Pipeline CLI smoke test
        if: steps.scope.outputs.audioTests == 'true'
        run: |
          python tools/audio_pipeline/pipeline.py --help
          python tools/audio_pipeline/evaluate.py --help
      - name: Synthetic audio timing tests
        if: steps.scope.outputs.audioTests == 'true'
        working-directory: tools/audio_pipeline
        run: python test_synthetic.py
      - name: Oshi sketch smoke test
        if: steps.scope.outputs.oshiSmoke == 'true'
        run: node tools/oshi_sketch_smoke.js
      - name: FINAL chart validation and Luna regression
        if: steps.scope.outputs.chartValidation == 'true'
        run: python tools/chart_validation.py
      - name: Luna full-song planning validation
        if: steps.scope.outputs.planningValidation == 'true'
        run: python tools/validate_luna_full_song_planning.py
      - name: Luna limb authority / immutable chart validation
        if: steps.scope.outputs.setupToolchains == 'true'
        run: node tools/validate-luna-limb-authority.mjs
      - name: Luna limb generator validation
        if: steps.scope.outputs.setupToolchains == 'true'
        run: node tools/generate-luna-full-limbs.mjs
      - name: Production pipeline validation
        if: steps.scope.outputs.pipelineValidation == 'true'
        run: python tools/validate_production_pipeline.py
      - name: Production pipeline smoke tests
        if: steps.scope.outputs.pipelineSmoke == 'true'
        run: |
          node tools/build-next-asset-queue.mjs /tmp/next-assets.json
          node tools/luna-production-path.mjs 1 8 /tmp/fast.json
          grep -q 'FAST_PATH' /tmp/fast.json
      - name: UI contract checks
        if: steps.scope.outputs.uiContract == 'true'
        run: python tools/ui_contract_test.py

  regression-008:
    name: 008 mesh-warp regression
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect whether 008 regression is relevant
        id: relevant
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(tools/character_layers/(build_mesh_warp_pose|run_visual_repair_trial)\.py|character-assets/generation-trials/mesh-warp-008-v1/|character-assets/config/mesh_warp_fast_lossless_v1\.json|character-assets/prototypes/luna_say_maybe_16m/(MESH_WARP_SPEED_STANDARD|EFFICIENT_VISUAL_REPAIR_WORKFLOW)\.md|\.github/workflows/validate\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install 008 regression dependencies
        if: steps.relevant.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check numpy pillow scipy
      - name: Run or verify 008 regression
        if: steps.relevant.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="character-assets/generation-trials/mesh-warp-008-v1"
          CFG="$OUT/008_mesh_config.json"
          RUNTIME="character-assets/layers/character/bd/hit_rf.png"
          MARKER="$OUT/008_regression_run.json"

          if [ -f "$MARKER" ]; then
            python - <<'PY'
import json
from pathlib import Path
out=Path("character-assets/generation-trials/mesh-warp-008-v1")
qa=json.loads((out/"008_qa.json").read_text())
reg=json.loads((out/"008_regression_run.json").read_text())
assert qa["machinePass"] is True
assert qa["outsideAllowedChangedPixels"] == 0
assert qa["fixedRegionChangedPixels"] == 0
assert qa["canvas"] == [1448,1086]
assert qa["mode"] == "RGBA"
assert reg["runtimeModified"] is False
assert reg["otherFramesTouched"] is False
assert reg["visualQaRequired"] is True
assert reg["userApprovalStatus"] != "APPROVED"
for name in [
  "008_bd_rf_hit_mesh_v1.png",
  "008_bd_rf_hit_mesh_v1_review.webp",
  "008_bd_rf_hit_fixed_drum_v1_review.webp",
  "008_before_after_review.webp",
  "008_timing.json",
  "008_run_manifest.json",
  "008_commit_manifest.json",
]:
    assert (out/name).exists(), name
print("committed 008 regression artifacts verified")
PY
            exit 0
          fi

          runtime_before="$(sha256sum "$RUNTIME" | awk '{print $1}')"

          python - <<'PY'
import hashlib,json
from pathlib import Path
cfgp=Path("character-assets/generation-trials/mesh-warp-008-v1/008_mesh_config.json")
cfg=json.loads(cfgp.read_text())
def sh(path):
    h=hashlib.sha256()
    with Path(path).open("rb") as f:
        for b in iter(lambda:f.read(1024*1024),b""):
            h.update(b)
    return h.hexdigest()
cfg["brokenSourceSha256"]=sh(cfg["inputPng"])
cfg["fixedDrumSha256"]=sh(cfg["fixedDrumPng"])
cfgp.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n")
PY

          python tools/character_layers/run_visual_repair_trial.py             --frame-config "$CFG"             --source character-assets/layers/character/bd/rebound_rf.png             --broken-source "$RUNTIME"             --fixed-drum character-assets/layers/drum/drum_base.png             --output-dir "$OUT"

          runtime_after="$(sha256sum "$RUNTIME" | awk '{print $1}')"
          test "$runtime_before" = "$runtime_after"

          python - <<'PY'
import json,subprocess
from pathlib import Path
out=Path("character-assets/generation-trials/mesh-warp-008-v1")
qa=json.loads((out/"008_qa.json").read_text())
assert qa["machinePass"] is True
assert qa["changedPixels"] == 36721
assert qa["changedBBox"] == {"x":594,"y":635,"width":172,"height":326}
assert qa["outsideAllowedChangedPixels"] == 0
assert qa["fixedRegionChangedPixels"] == 0
assert abs(float(qa["pedalDistancePx"])-11.18) <= 0.01
assert qa["canvas"] == [1448,1086] and qa["mode"] == "RGBA"
changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
assert not any(p.startswith("character-assets/layers/character/") for p in changed), changed
assert not any(any(tok in Path(p).name for tok in ("010","014","028","032")) for p in changed), changed
print("008 regression machine QA PASS")
PY
      - name: Commit 008 regression outputs to PR branch
        if: steps.relevant.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="character-assets/generation-trials/mesh-warp-008-v1"
          if [ ! -f "$OUT/008_regression_run.json" ]; then
            echo "regression marker missing" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --             "$OUT/008_mesh_config.json"             "$OUT/008_bd_rf_hit_mesh_v1.png"             "$OUT/008_bd_rf_hit_mesh_v1_review.webp"             "$OUT/008_bd_rf_hit_fixed_drum_v1_review.webp"             "$OUT/008_before_after_review.webp"             "$OUT/008_qa.json"             "$OUT/008_timing.json"             "$OUT/008_run_manifest.json"             "$OUT/008_commit_manifest.json"             "$OUT/008_regression_run.json"

          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "Regression outputs already committed."
            exit 0
          fi
          echo "$staged"
          if echo "$staged" | grep -E '^character-assets/layers/character/'; then
            echo "runtime path detected" >&2; exit 1
          fi
          if echo "$staged" | grep -E '(^|/)(010|014|028|032)[^/]*'; then
            echo "other frame detected" >&2; exit 1
          fi

          git commit -m "test: record 008 fast pipeline regression"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
