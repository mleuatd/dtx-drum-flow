name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "character-assets/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/runtime-character-qa.yml"
      - "tools/runtime-character-qa.mjs"
      - "docs/PUBLIC_RUNTIME_QA.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Preserve each commit's deploy while public runtime QA waits for its exact build SHA.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage character assets for site
        run: |
          rm -rf site/character-assets
          cp -R character-assets site/character-assets

      - name: Write deployment build identifier
        run: |
          printf '{"commitSha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/build.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
