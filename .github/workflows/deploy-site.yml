name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "character-assets/layers/**"
      - "character-assets/config/**"
      - "character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/runtime-character-qa.yml"
      - ".github/workflows/visual-integrity-batch-runtime-qa.yml"
      - "tools/runtime-character-qa.mjs"
      - "docs/PUBLIC_RUNTIME_QA.md"
      - ".github/back-runtime-qa.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Preserve each formal/runtime commit's deploy while public runtime QA waits for its exact build SHA.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage runtime-only character assets for site
        run: |
          rm -rf site/character-assets
          mkdir -p site/character-assets/layers
          mkdir -p site/character-assets/prototypes/luna_say_maybe_16m
          cp -R character-assets/layers/. site/character-assets/layers/
          cp character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json site/character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json

      - name: Checkout PRE-FIX source
        uses: actions/checkout@v4
        with:
          ref: a4e3854449e292264192afa63469edf0fb5048af
          path: _pre_fix_source
          fetch-depth: 1

      - name: Stage PRE-FIX and POST-FIX snapshots
        run: |
          set -euo pipefail
          rm -rf /tmp/dtx-post-fix site/pre-fix site/post-fix site/donor-mesh-v3
          mkdir -p /tmp/dtx-post-fix
          cp -R site/. /tmp/dtx-post-fix/

          mkdir -p site/post-fix
          cp -R /tmp/dtx-post-fix/. site/post-fix/

          mkdir -p site/pre-fix
          cp -R _pre_fix_source/site/. site/pre-fix/
          rm -rf site/pre-fix/character-assets
          mkdir -p site/pre-fix/character-assets/layers
          mkdir -p site/pre-fix/character-assets/prototypes/luna_say_maybe_16m
          cp -R _pre_fix_source/character-assets/layers/. site/pre-fix/character-assets/layers/
          cp _pre_fix_source/character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json site/pre-fix/character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json

          cp site/version-switcher.js site/pre-fix/version-switcher.js
          cp site/version-switcher.css site/pre-fix/version-switcher.css

          mkdir -p site/donor-mesh-v3
          cp -R /tmp/dtx-post-fix/. site/donor-mesh-v3/
          rm -rf site/donor-mesh-v3/character-assets/layers
          mkdir -p site/donor-mesh-v3/character-assets/layers
          cp -R _pre_fix_source/character-assets/layers/. site/donor-mesh-v3/character-assets/layers/
          cp -R character-assets/versions/donor-mesh-v3/overlays/. site/donor-mesh-v3/character-assets/layers/character/
          cp site/version-switcher.js site/donor-mesh-v3/version-switcher.js
          cp site/version-switcher.css site/donor-mesh-v3/version-switcher.css

          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/pre-fix/index.html")
          s = p.read_text(encoding="utf-8")
          if "version-switcher.css" not in s:
              s = s.replace("</head>", '  <link rel="stylesheet" href="./version-switcher.css?v=20260920-prepost-r1">\n</head>')
          if "version-switcher.js" not in s:
              s = s.replace("</body>", '  <script src="./version-switcher.js?v=20260920-prepost-r1" defer></script>\n</body>')
          p.write_text(s, encoding="utf-8")
          PY

          rm -rf _pre_fix_source

      - name: Write deployment build identifier
        run: |
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"version":"POST-FIX","commitSha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$BUILT_AT" > site/build.json
          printf '{"version":"POST-FIX","commitSha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$BUILT_AT" > site/post-fix/build.json
          printf '{"version":"PRE-FIX","commitSha":"a4e3854449e292264192afa63469edf0fb5048af","builtAt":"%s"}\n' "$BUILT_AT" > site/pre-fix/build.json
          printf '{"version":"DONOR-MESH-V3","commitSha":"%s","baseCommit":"a4e3854449e292264192afa63469edf0fb5048af","builtAt":"%s"}\n' "$GITHUB_SHA" "$BUILT_AT" > site/donor-mesh-v3/build.json

      - name: Validate staged V1/V2/V3 snapshots
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/pre-fix/index.html
          test -f site/post-fix/index.html
          test -f site/pre-fix/character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json
          test -f site/post-fix/character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json
          test -f site/donor-mesh-v3/character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json
          test -f site/pre-fix/version-switcher.js
          test -f site/post-fix/version-switcher.js
          test -f site/donor-mesh-v3/version-switcher.js
          grep -q 'version-switcher.js' site/index.html
          grep -q 'version-switcher.js' site/pre-fix/index.html
          grep -q 'version-switcher.js' site/post-fix/index.html
          grep -q 'version-switcher.js' site/donor-mesh-v3/index.html
          grep -q '"version":"PRE-FIX"' site/pre-fix/build.json
          grep -q '"version":"POST-FIX"' site/post-fix/build.json
          grep -q '"version":"DONOR-MESH-V3"' site/donor-mesh-v3/build.json
          test -f site/donor-mesh-v3/character-assets/layers/character/combo/bd_hh_sn_rf_r_l_hit_refresh.png
          test -f site/donor-mesh-v3/character-assets/layers/character/combo/bd_rc_sn_rf_r_l_hit_refresh.png
          test -f site/donor-mesh-v3/character-assets/layers/character/combo/bd_rd_rf_r_hit_refresh.png
          test -f site/donor-mesh-v3/character-assets/layers/character/combo/hh_sn_r_l_rebound_refresh.png
          cmp character-assets/versions/donor-mesh-v3/overlays/combo/bd_hh_sn_rf_r_l_hit_refresh.png site/donor-mesh-v3/character-assets/layers/character/combo/bd_hh_sn_rf_r_l_hit_refresh.png
          cmp character-assets/versions/donor-mesh-v3/overlays/combo/bd_rc_sn_rf_r_l_hit_refresh.png site/donor-mesh-v3/character-assets/layers/character/combo/bd_rc_sn_rf_r_l_hit_refresh.png
          cmp character-assets/versions/donor-mesh-v3/overlays/combo/bd_rd_rf_r_hit_refresh.png site/donor-mesh-v3/character-assets/layers/character/combo/bd_rd_rf_r_hit_refresh.png
          cmp character-assets/versions/donor-mesh-v3/overlays/combo/hh_sn_r_l_rebound_refresh.png site/donor-mesh-v3/character-assets/layers/character/combo/hh_sn_r_l_rebound_refresh.png
          if diff -qr site/pre-fix/character-assets/layers site/post-fix/character-assets/layers >/tmp/pre-post-assets.diff; then
            echo "PRE-FIX and POST-FIX character layer trees are unexpectedly identical"
            exit 1
          fi
          echo "V1/V2/V3 staged snapshots validated"
          head -n 20 /tmp/pre-post-assets.diff

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published V1/V2/V3 routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          fetch() {
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$1"
          }
          ROOT_HTML="$(fetch "$BASE/")"
          PRE_HTML="$(fetch "$BASE/pre-fix/")"
          POST_HTML="$(fetch "$BASE/post-fix/")"
          V3_HTML="$(fetch "$BASE/donor-mesh-v3/")"
          PRE_BUILD="$(fetch "$BASE/pre-fix/build.json")"
          POST_BUILD="$(fetch "$BASE/post-fix/build.json")"
          V3_BUILD="$(fetch "$BASE/donor-mesh-v3/build.json")"
          printf '%s' "$ROOT_HTML" | grep -q 'version-switcher.js'
          printf '%s' "$PRE_HTML" | grep -q 'version-switcher.js'
          printf '%s' "$POST_HTML" | grep -q 'version-switcher.js'
          printf '%s' "$V3_HTML" | grep -q 'version-switcher.js'
          printf '%s' "$PRE_BUILD" | grep -q '"version":"PRE-FIX"'
          printf '%s' "$POST_BUILD" | grep -q '"version":"POST-FIX"'
          printf '%s' "$V3_BUILD" | grep -q '"version":"DONOR-MESH-V3"'
          echo "Published root/PRE-FIX/POST-FIX/V3 routes verified"
