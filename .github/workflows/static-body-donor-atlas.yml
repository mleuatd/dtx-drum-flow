name: Build static body donor atlas
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/static-body-donor-atlas.yml"
      - "tools/character_layers/build_static_body_donor_atlas.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-body-donor-atlas
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            character-assets/layers/character
            tools/character_layers/build_static_body_donor_atlas.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/character_layers/build_static_body_donor_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: static-body-donor-atlas-${{ github.run_id }}
          path: character-assets/edit-workspaces/motion-repair-20260920/static-body-atlas/
          retention-days: 30
