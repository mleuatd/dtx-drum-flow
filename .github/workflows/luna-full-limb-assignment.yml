name: Luna Full Limb Assignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/luna-full-limb-assignment.yml"
      - "tools/generate-luna-full-limbs.mjs"
      - "character-assets/prototypes/luna_say_maybe_16m/hand_rules.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate and validate full-song limbs
        run: node tools/generate-luna-full-limbs.mjs
      - name: Promote validated sidecar and report
        run: |
          cp limb-artifacts/Luna_say_maybe_full_limbs_CANDIDATE.json site/charts/luna_say_maybe/Luna_say_maybe_full_limbs.json
          cp limb-artifacts/Luna_say_maybe_full_limbs_VALIDATION.json character-assets/prototypes/luna_say_maybe_16m/FULL_SONG_LIMB_VALIDATION.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/charts/luna_say_maybe/Luna_say_maybe_full_limbs.json character-assets/prototypes/luna_say_maybe_16m/FULL_SONG_LIMB_VALIDATION.json
          if ! git diff --cached --quiet; then
            git commit -m "data: promote Luna full-song limb sidecar"
            git push
          fi
      - name: Upload limb evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-full-limb-assignment
          path: limb-artifacts
          if-no-files-found: error
