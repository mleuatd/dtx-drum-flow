name: Build active motion repair candidates
on:
  push:
    branches: [main]
    paths:
      - 'tools/character_layers/build_active_motion_repair_candidates.py'
      - '.github/workflows/build-active-motion-repair-candidates.yml'
      - '.github/back-visual-actions.txt'
permissions:
  contents: write
concurrency:
  group: motion-repair-back
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Read BACK queue
        id: queue
        shell: bash
        run: echo "action_keys=$(tr -d '\r\n' < .github/back-visual-actions.txt)" >> "$GITHUB_OUTPUT"
      - name: Claim queued BACK action keys
        env:
          CLAIM_OWNER: CHAT-PASS2-BACK
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          q=Path(".github/back-visual-actions.txt")
          keys=[x.strip() for x in q.read_text().replace("\n",",").split(",") if x.strip()]
          p=Path("character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json")
          d=json.loads(p.read_text())
          batch="BACK-ACTIONS-"+os.environ.get("GITHUB_RUN_ID","local")
          now=datetime.now(timezone.utc).isoformat()
          for x in d.get("defects",[]):
              if x.get("actionKey") not in keys or x.get("status")=="VERIFIED": continue
              cl=x.get("claim") or {}
              if cl.get("state")=="CLAIMED" and cl.get("owner")!=os.environ["CLAIM_OWNER"]: continue
              x["claim"]={"state":"CLAIMED","batch":batch,"owner":os.environ["CLAIM_OWNER"],"claimedAt":now}
          d["updatedAt"]=now
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Build BACK claimed candidates
        env:
          CLAIM_OWNER: CHAT-PASS2-BACK
          ACTION_KEYS: ${{ steps.queue.outputs.action_keys }}
        run: python tools/character_layers/build_active_motion_repair_candidates.py
      - name: Upload pass2 QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass2-motion-repair-candidates
          path: character-assets/edit-workspaces/motion-repair-20260920/auto/
      - name: Commit candidates and QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/edit-workspaces/motion-repair-20260920/auto/ character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: build claimed active motion repair candidates"
          git push
