name: Deploy final posefix Pages once

on:
  pull_request:
    branches: [main]
    paths:
      - "character-assets/staging/pages_posefix_deploy_trigger_20260918.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-posefix-once
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'posefix-pages-deploy-20260918'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event.pull_request.head.ref == 'posefix-pages-deploy-20260918'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
