name: FRONT06 finish MOTION-002 v3
on:
  push:
    branches: [main]
    paths:
      - ".github/front06-promote.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: front06-finish
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_URL: https://mleuatd.github.io/dtx-drum-flow/
      MEASURE_START: "128"
      MEASURE_END: "128"
      QA_ACTIONS: "BD+RC:RF/R"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/character_layers/requirements.txt

      - run: pip install --disable-pip-version-check -r tools/character_layers/requirements.txt

      - name: Verify candidate, formalize if needed, and set exact runtime target
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path(".")
          ws=root/"character-assets/edit-workspaces/motion-repair-20260920/front06"
          state_p=ws/"FRONT06_PROMOTION_STATE.json"
          static_p=ws/"FRONT06_STATIC_VISUAL_QA_V3.json"
          summary_p=ws/"FRONT06_CANDIDATE_SUMMARY_V3.json"
          backlog_p=root/"character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json"
          inventory_p=root/"character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json"
          assets_manifest_p=root/"character-assets/config/assets_manifest.json"

          state=json.loads(state_p.read_text())
          static=json.loads(static_p.read_text())
          summary=json.loads(summary_p.read_text())
          backlog=json.loads(backlog_p.read_text())
          defect=next(x for x in backlog["defects"] if x["issueId"]=="MOTION-002")
          if defect.get("status")=="VERIFIED":
              raise SystemExit("MOTION-002 already VERIFIED")

          claim=defect.get("claim") or {}
          assert claim.get("state")=="CLAIMED" and claim.get("owner")=="CHATGPT-FRONT" and claim.get("batch")=="HOLD-REPAIR-FRONT-06", claim
          assert summary.get("pairMachinePass") is True
          assert all(v in ("PASS","PASS_NONE") for v in static.get("gates",{}).values()), static.get("gates")
          rt=state.get("candidateRuntimeQa") or {}
          assert rt.get("status")=="PASS" and int(rt.get("runId",0))==35483787908 and int(rt.get("artifactId",0))==10596886963, rt

          pairs=[
            ("hit",ws/"bd_rc_hit_candidate_v3.png",root/"character-assets/layers/character/combo/bd_rc_hit.png","layers/character/combo/bd_rc_hit.png"),
            ("rebound",ws/"bd_rc_rebound_candidate_v3.png",root/"character-assets/layers/character/combo/bd_rc_rebound.png","layers/character/combo/bd_rc_rebound.png")
          ]
          inv=json.loads(inventory_p.read_text()); am=json.loads(assets_manifest_p.read_text())
          new_sha={}
          for phase,src,dst,rel in pairs:
              got=hashlib.sha256(src.read_bytes()).hexdigest()
              assert got==state["candidateSha256"][phase], (phase,got,state["candidateSha256"][phase])
              if not dst.exists() or hashlib.sha256(dst.read_bytes()).hexdigest()!=got:
                  dst.write_bytes(src.read_bytes())
              new_sha[phase]=got
              for v in inv.get("requiredFrames",{}).values():
                  if v.get("path")==rel: v["sha256"]=got
              full="character-assets/"+rel
              found=False
              for a in am.get("assets",[]):
                  if a.get("path")==full:
                      a["sha256"]=got; found=True
              assert found, full

          inv["runtimeQaTarget"]={
            "measureStart":128,"measureEnd":128,"actions":["BD+RC:RF/R"],
            "progressPath":"character-assets/edit-workspaces/motion-repair-20260920/front06/FRONT06_PROMOTION_STATE.json",
            "blockKey":"FRONT06-MOTION-002"
          }
          sa=(defect.get("repairSpec") or {}).get("sourceAuthority") or {}
          sa["hitSha256"]=new_sha["hit"]; sa["reboundSha256"]=new_sha["rebound"]
          defect.setdefault("repairSpec",{})["sourceAuthority"]=sa
          defect["status"]="PROMOTED_PENDING_PUBLIC_RUNTIME"
          state["status"]="PROMOTED_PENDING_PUBLIC_RUNTIME"; state["formalSha256"]=new_sha
          inventory_p.write_text(json.dumps(inv,ensure_ascii=False,indent=2)+"\n")
          assets_manifest_p.write_text(json.dumps(am,ensure_ascii=False,indent=2)+"\n")
          backlog_p.write_text(json.dumps(backlog,ensure_ascii=False,indent=2)+"\n")
          state_p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Validate exact promoted formal set
        run: python tools/character_layers/validate_assets.py

      - name: Push formal promotion if checkout differs from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             character-assets/layers/character/combo/bd_rc_hit.png             character-assets/layers/character/combo/bd_rc_rebound.png             character-assets/config/assets_manifest.json             character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json             character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json             character-assets/edit-workspaces/motion-repair-20260920/front06/FRONT06_PROMOTION_STATE.json
          if ! git diff --cached --quiet; then
            git commit -m "repair: promote verified FRONT06 BD+RC v3 candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Explicitly dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-linux

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Public real-chart PC/Xperia QA
        run: node tools/runtime-character-qa.mjs

      - name: Upload final public runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front06-public-runtime-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Finalize VERIFIED on latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          state_p=Path("character-assets/edit-workspaces/motion-repair-20260920/front06/FRONT06_PROMOTION_STATE.json")
          backlog_p=Path("character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json")
          state=json.loads(state_p.read_text())
          backlog=json.loads(backlog_p.read_text())
          defect=next(x for x in backlog["defects"] if x["issueId"]=="MOTION-002")
          claim=defect.get("claim") or {}
          assert claim.get("owner")=="CHATGPT-FRONT" and claim.get("batch")=="HOLD-REPAIR-FRONT-06", claim
          run=os.environ["GITHUB_RUN_ID"]
          ev={
            "status":"PASS",
            "workflow":".github/workflows/front06-promote.yml",
            "runId":int(run),
            "artifact":f"front06-public-runtime-{run}",
            "testedAt":datetime.now(timezone.utc).isoformat(),
            "measureStart":128,"measureEnd":128,
            "actions":["BD+RC:RF/R"],
            "viewports":["pc 1280x900","xperia-portrait 384x864"]
          }
          state.setdefault("runtimeQaEvidence",{})["FRONT06-MOTION-002"]=ev
          state["status"]="VERIFIED"; state["verifiedByPublicRuntime"]=ev
          defect["status"]="VERIFIED"; defect["claim"]=None
          defect["updatedAt"]=ev["testedAt"]
          defect["fixDecision"]="FRONT06 v3 promoted after static pair PASS, candidate real-chart PC/Xperia PASS, formal validation PASS, and public real-chart PC/Xperia PASS."
          evidence=defect.setdefault("evidence",[])
          line=f"public runtime QA run {run} artifact front06-public-runtime-{run}"
          if line not in evidence: evidence.append(line)
          backlog["updatedAt"]=ev["testedAt"]
          state_p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+"\n")
          backlog_p.write_text(json.dumps(backlog,ensure_ascii=False,indent=2)+"\n")
          PY
          git add             character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json             character-assets/edit-workspaces/motion-repair-20260920/front06/FRONT06_PROMOTION_STATE.json
          git commit -m "qa: verify MOTION-002 and release FRONT claim"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt*2))
          done
          exit 1
