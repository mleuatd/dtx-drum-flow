name: Mirror character assets to Dropbox

on:
  push:
    branches: [main]
    paths:
      - "character-assets/dropbox-mirror-staging/**/*.json"
  workflow_dispatch:
    inputs:
      staging_path:
        description: "Repository path to one Dropbox mirror staging JSON"
        required: true

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve staging JSON
        id: stage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STAGING_PATH="${{ inputs.staging_path }}"
          else
            STAGING_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^character-assets/dropbox-mirror-staging/.*\.json$' | head -n 1)"
          fi
          test -n "$STAGING_PATH"
          test -f "$STAGING_PATH"
          echo "path=$STAGING_PATH" >> "$GITHUB_OUTPUT"
      - name: Validate and upload exact repository bytes to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          STAGING_PATH: ${{ steps.stage.outputs.path }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          stage_path=pathlib.Path(os.environ["STAGING_PATH"])
          stage=json.loads(stage_path.read_text(encoding="utf-8"))
          if stage.get("status")=="MIRRORED":
              print("Already mirrored")
              raise SystemExit(0)
          token=os.environ.get("DROPBOX_ACCESS_TOKEN")
          if not token:
              raise SystemExit("DROPBOX_ACCESS_TOKEN is required")
          for item in stage.get("assets",[]):
              src=pathlib.Path(item["repoPath"])
              raw=src.read_bytes()
              sha=hashlib.sha256(raw).hexdigest()
              if sha != item["sha256"]:
                  raise SystemExit(f"sha mismatch for {src}: {sha}")
              req=urllib.request.Request(
                  "https://content.dropboxapi.com/2/files/upload",
                  data=raw,
                  method="POST",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Content-Type":"application/octet-stream",
                      "Dropbox-API-Arg":json.dumps({"path":item["dropboxPath"],"mode":"overwrite","autorename":False,"mute":True})
                  }
              )
              with urllib.request.urlopen(req) as r:
                  response=json.loads(r.read().decode("utf-8"))
              item["dropboxFileId"]=response.get("id")
              item["dropboxRev"]=response.get("rev")
              item["mirroredSha256"]=sha
              print("mirrored",src,"->",item["dropboxPath"],sha)
          stage["status"]="MIRRORED"
          stage_path.write_text(json.dumps(stage,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit mirror evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.stage.outputs.path }}"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "assets: record Dropbox mirror"
          git pull --rebase origin main
          git push origin HEAD:main
