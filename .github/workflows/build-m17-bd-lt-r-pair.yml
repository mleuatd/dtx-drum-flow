name: Build M17 BD+LT RF/R pair

on:
  push:
    branches: [main]
    paths:
      - "character-assets/generation-staging/m17-bd-lt-r.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Build deterministic BD+LT pair
        run: python tools/build-m17-bd-lt-r-pair.py
      - name: Run candidate QA
        run: |
          python tools/character_candidate_qa.py character-assets/layers/character/combo/bd_lt_rf_r_hit_refresh.png --neutral character-assets/layers/character/base/neutral.png --out character-assets/generated-qa/m17-bd-lt-r/hit-qa.json
          python tools/character_candidate_qa.py character-assets/layers/character/combo/bd_lt_rf_r_rebound_refresh.png --neutral character-assets/layers/character/base/neutral.png --out character-assets/generated-qa/m17-bd-lt-r/rebound-qa.json
          python tools/build-character-qa-preview.py --neutral character-assets/layers/character/base/neutral.png --hit character-assets/layers/character/combo/bd_lt_rf_r_hit_refresh.png --rebound character-assets/layers/character/combo/bd_lt_rf_r_rebound_refresh.png --drum character-assets/layers/drum/drum_base.png --contacts character-assets/prototypes/luna_say_maybe_16m/INSTRUMENT_CONTACT_POINTS.json --parts BD,LT --out-dir character-assets/generated-qa/m17-bd-lt-r/preview
      - uses: actions/upload-artifact@v4
        with:
          name: m17-bd-lt-r-pair
          path: |
            character-assets/layers/character/combo/bd_lt_rf_r_hit_refresh.png
            character-assets/layers/character/combo/bd_lt_rf_r_rebound_refresh.png
            character-assets/generated-qa/m17-bd-lt-r
      - name: Commit generated pair and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character/combo/bd_lt_rf_r_* character-assets/generated-qa/m17-bd-lt-r
          git commit -m "assets: build M17 BD+LT RF/R hit rebound"
          git pull --rebase origin main
          git push origin HEAD:main
