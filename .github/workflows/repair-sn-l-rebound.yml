name: Repair SN-L rebound candidate
on:
  push:
    branches: [main]
    paths:
      - 'tools/character_layers/repair_sn_l_rebound.py'
      - '.github/workflows/repair-sn-l-rebound.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Build candidate and deterministic QA
        run: python tools/character_layers/repair_sn_l_rebound.py
      - name: Runtime pose regression tests
        run: python -m unittest discover -s tools/runtime_pose/tests -p 'test_*.py'
      - name: Commit candidate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/edit-workspaces/motion-repair-20260920/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: build SN-L rebound motion repair candidate"
          git push
