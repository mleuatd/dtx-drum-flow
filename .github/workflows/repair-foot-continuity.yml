name: Repair performance foot continuity
on:
  push:
    branches: [main]
    paths: ["character-assets/production/20261008/scripts/repair_foot_continuity.py", ".github/workflows/repair-foot-continuity.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy scipy
      - run: python character-assets/production/20261008/scripts/repair_foot_continuity.py
      - name: Save repaired images and restart checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets site
          git diff --cached --quiet || git commit -m "fix: keep performance foot on pedal and lift heel for rebound"
          git pull --rebase origin main
          git push origin HEAD:main
