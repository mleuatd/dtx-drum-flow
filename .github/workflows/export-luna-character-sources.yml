name: Export Luna Character Sources
on:
  push:
    paths:
      - '.github/workflows/export-luna-character-sources.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: luna-character-sources
          path: |
            character-assets/layers/character/base/neutral.png
            character-assets/layers/character/sn/hit_l.png
            character-assets/layers/character/sn/rebound_l.png
            character-assets/layers/character/combo/bd_rc_hit.png
            character-assets/layers/character/combo/bd_rc_rebound.png
            character-assets/layers/drum/drum_base.png
