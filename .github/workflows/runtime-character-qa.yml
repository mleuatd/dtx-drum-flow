name: Runtime Character QA

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "character-assets/layers/**"
      - "character-assets/config/**"
      - "character-assets/prototypes/luna_say_maybe_18_24/PROGRESS.json"
      - "character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json"
      - "site/charts/luna_say_maybe/**"
      - "tools/runtime-character-qa.mjs"
      - ".github/workflows/runtime-character-qa.yml"
      - ".github/workflows/deploy-site.yml"
      - "docs/PUBLIC_RUNTIME_QA.md"
  workflow_dispatch:
    inputs:
      measure_start:
        description: "First measure"
        required: false
        default: "18"
      measure_end:
        description: "Last measure"
        required: false
        default: "24"
      actions:
        description: "Comma-separated required action keys"
        required: false
        default: "BD+RD:RF/R,RD+SN:R/L,BD+HH:RF/R,HH+SN:R/L"

permissions:
  contents: write

concurrency:
  group: public-runtime-qa-${{ github.ref }}
  # Do not cancel a run while it waits for its own Pages build; that loses evidence.
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://mleuatd.github.io/dtx-drum-flow/
      MEASURE_START: ${{ inputs.measure_start || '18' }}
      MEASURE_END: ${{ inputs.measure_end || '24' }}
      QA_ACTIONS: ${{ inputs.actions || 'BD+RD:RF/R,RD+SN:R/L,BD+HH:RF/R,HH+SN:R/L' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for matching Pages deployment and run browser QA
        id: browser_qa
        continue-on-error: true
        run: node tools/runtime-character-qa.mjs
      - name: Upload runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-runtime-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30
      - name: Persist M18-24 QA state
        if: always() && env.MEASURE_START == '18' && env.MEASURE_END == '24'
        env:
          QA_OUTCOME: ${{ steps.browser_qa.outcome }}
        run: |
          python - <<'PY'
          import json, os
          p="character-assets/prototypes/luna_say_maybe_18_24/PROGRESS.json"
          with open(p,encoding="utf-8") as f: d=json.load(f)
          ok=os.environ.get("QA_OUTCOME")=="success"
          run=os.environ.get("GITHUB_RUN_ID","")
          sha=os.environ.get("GITHUB_SHA","")
          q=d.setdefault("qaInfrastructure",{})
          q.update({"state":"PASS" if ok else "FAIL","workflow":".github/workflows/runtime-character-qa.yml","runId":run,"testedCommitSha":sha,"artifact":f"public-runtime-qa-{run}","runUrl":f"https://github.com/mleuatd/dtx-drum-flow/actions/runs/{run}"})
          dod=d.setdefault("definitionOfDone",{})
          dod["publicRuntimeBrowserQA"]="PASS" if ok else "FAIL"; dod["done"]=ok
          d["status"]="DONE" if ok else "PUBLIC_RUNTIME_QA_FAILED"
          d["blocker"]=None if ok else {"workflowRunId":run,"failedStep":"Wait for matching Pages deployment and run browser QA","error":"See workflow log and public-runtime-qa artifact","investigated":False,"retryWhen":"after root cause is identified and a corrective commit changes the failing condition","requiredNext":"inspect runtime-qa.json and job log; do not rerun unchanged failure"}
          from datetime import datetime, timezone
          d["updatedAt"]=datetime.now(timezone.utc).isoformat()
          with open(p,"w",encoding="utf-8") as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/prototypes/luna_say_maybe_18_24/PROGRESS.json
          git diff --cached --quiet || git commit -m "qa: record M18-24 public runtime result"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce browser QA result
        if: steps.browser_qa.outcome != 'success'
        run: exit 1
