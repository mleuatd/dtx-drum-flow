name: Runtime Character QA

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "character-assets/layers/**"
      - "character-assets/config/**"
      - "character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json"
      - "site/charts/luna_say_maybe/**"
      - "tools/runtime-character-qa.mjs"
      - ".github/workflows/runtime-character-qa.yml"
      - ".github/workflows/deploy-site.yml"
      - "docs/PUBLIC_RUNTIME_QA.md"
      - ".github/back-runtime-qa.json"
  workflow_dispatch:
    inputs:
      measure_start:
        description: "First measure"
        required: false
        default: "18"
      measure_end:
        description: "Last measure"
        required: false
        default: "24"
      actions:
        description: "Comma-separated required action keys"
        required: false
        default: "BD+RD:RF/R,RD+SN:R/L,BD+HH:RF/R,HH+SN:R/L"

permissions:
  contents: write

concurrency:
  group: public-runtime-qa-v2-${{ github.ref }}
  # Do not cancel a run while it waits for its own Pages build; that loses evidence.
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://mleuatd.github.io/dtx-drum-flow/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve runtime QA target
        env:
          INPUT_MEASURE_START: ${{ inputs.measure_start }}
          INPUT_MEASURE_END: ${{ inputs.measure_end }}
          INPUT_ACTIONS: ${{ inputs.actions }}
        run: |
          python - <<'PY'
          import json, os
          inv=json.load(open("character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json",encoding="utf-8"))
          target=inv.get("runtimeQaTarget") or {}
          if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch":
              start=os.environ.get("INPUT_MEASURE_START") or "18"
              end=os.environ.get("INPUT_MEASURE_END") or "24"
              actions=os.environ.get("INPUT_ACTIONS") or "BD+RD:RF/R,RD+SN:R/L,BD+HH:RF/R,HH+SN:R/L"
              progress=""
              block=f"M{start}-{end}"
          else:
              # A direct BACK runtime-QA marker is authoritative only for the push
              # that changed that marker. This avoids changing the shared inventory
              # runtimeQaTarget while another terminal is working.
              override=None
              try:
                  event=json.load(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8"))
                  changed=[]
                  for commit in event.get("commits") or []:
                      for k in ("added","modified","removed"):
                          changed.extend(commit.get(k) or [])
                  marker=".github/back-runtime-qa.json"
                  if marker in changed and os.path.exists(marker):
                      override=json.load(open(marker,encoding="utf-8"))
              except Exception as ex:
                  print("BACK runtime override ignored:",ex)
              use=override or target
              start=str(use.get("measureStart",18))
              end=str(use.get("measureEnd",24))
              a=use.get("actions") or ["BD+RD:RF/R","RD+SN:R/L","BD+HH:RF/R","HH+SN:R/L"]
              actions=",".join(a) if isinstance(a,list) else str(a)
              progress=str(use.get("progressPath",""))
              block=str(use.get("blockKey",f"M{start}-{end}"))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as g:
              g.write(f"MEASURE_START={start}\nMEASURE_END={end}\nQA_ACTIONS={actions}\n")
              g.write(f"RUNTIME_QA_PROGRESS_PATH={progress}\nRUNTIME_QA_BLOCK_KEY={block}\n")
          print(json.dumps({"measureStart":start,"measureEnd":end,"actions":actions,"progressPath":progress,"blockKey":block},ensure_ascii=False))
          PY
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-linux
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for matching Pages deployment and run browser QA
        id: browser_qa
        continue-on-error: true
        run: node tools/runtime-character-qa.mjs
      - name: Upload runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-runtime-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30
      - name: Persist M18-24 QA state
        if: always() && env.MEASURE_START == '18' && env.MEASURE_END == '24'
        env:
          QA_OUTCOME: ${{ steps.browser_qa.outcome }}
        run: |
          python - <<'PY'
          import json, os
          p="character-assets/prototypes/luna_say_maybe_18_24/PROGRESS.json"
          with open(p,encoding="utf-8") as f: d=json.load(f)
          ok=os.environ.get("QA_OUTCOME")=="success"
          run=os.environ.get("GITHUB_RUN_ID","")
          sha=os.environ.get("GITHUB_SHA","")
          q=d.setdefault("qaInfrastructure",{})
          q.update({"state":"PASS" if ok else "FAIL","workflow":".github/workflows/runtime-character-qa.yml","runId":run,"testedCommitSha":sha,"artifact":f"public-runtime-qa-{run}","runUrl":f"https://github.com/mleuatd/dtx-drum-flow/actions/runs/{run}"})
          dod=d.setdefault("definitionOfDone",{})
          dod["publicRuntimeBrowserQA"]="PASS" if ok else "FAIL"; dod["done"]=ok
          d["status"]="DONE" if ok else "PUBLIC_RUNTIME_QA_FAILED"
          d["blocker"]=None if ok else {"workflowRunId":run,"failedStep":"Wait for matching Pages deployment and run browser QA","error":"See workflow log and public-runtime-qa artifact","investigated":False,"retryWhen":"after root cause is identified and a corrective commit changes the failing condition","requiredNext":"inspect runtime-qa.json and job log; do not rerun unchanged failure"}
          from datetime import datetime, timezone
          d["updatedAt"]=datetime.now(timezone.utc).isoformat()
          with open(p,"w",encoding="utf-8") as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/prototypes/luna_say_maybe_18_24/PROGRESS.json
          git diff --cached --quiet || git commit -m "qa: record M18-24 public runtime result"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Persist generic runtime QA state
        if: always() && env.RUNTIME_QA_PROGRESS_PATH != ''
        env:
          QA_OUTCOME: ${{ steps.browser_qa.outcome }}
        run: |
          # A newer main push may cancel this QA job via concurrency. Cancellation is
          # not a character failure and must never overwrite the ledger with FAIL.
          if [ "$QA_OUTCOME" = "cancelled" ] || [ "$QA_OUTCOME" = "skipped" ]; then
            echo "QA outcome is $QA_OUTCOME; preserving current progress state."
            exit 0
          fi

          # Persist onto the latest main. Do not commit on an old checkout and then
          # rebase the same ledger file: parallel character/audio terminals can update
          # main between browser QA and persistence, producing a false workflow FAIL.
          # Instead, re-read origin/main, reapply the small ledger mutation, and retry
          # a rejected push from the new head.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Ledger persistence attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json, os
          p=os.environ["RUNTIME_QA_PROGRESS_PATH"]
          with open(p,encoding="utf-8") as f: d=json.load(f)
          ok=os.environ.get("QA_OUTCOME")=="success"
          run=os.environ.get("GITHUB_RUN_ID","")
          sha=os.environ.get("GITHUB_SHA","")
          block=os.environ.get("RUNTIME_QA_BLOCK_KEY") or f"M{os.environ.get('MEASURE_START')}-{os.environ.get('MEASURE_END')}"
          q=d.setdefault("runtimeQaEvidence",{})
          q[block]={
            "status":"PASS" if ok else "FAIL",
            "workflow":".github/workflows/runtime-character-qa.yml",
            "runId":run,
            "testedCommitSha":sha,
            "artifact":f"public-runtime-qa-{run}",
            "runUrl":f"https://github.com/mleuatd/dtx-drum-flow/actions/runs/{run}",
            "measureStart":int(os.environ["MEASURE_START"]),
            "measureEnd":int(os.environ["MEASURE_END"]),
            "actions":[x for x in os.environ.get("QA_ACTIONS","").split(",") if x]
          }
          if ok:
              d["status"]=f"{block.replace('-','_')}_PUBLIC_RUNTIME_QA_PASSED"
              d["blocker"]=None
          else:
              d["status"]=f"{block.replace('-','_')}_PUBLIC_RUNTIME_QA_FAILED"
              d["blocker"]={"type":"RUNTIME_QA","workflowRunId":run,"requiredNext":"Inspect runtime-qa.json/screenshots/job log; repair root cause before retry."}
          from datetime import datetime, timezone
          d["updatedAt"]=datetime.now(timezone.utc).isoformat()
          with open(p,"w",encoding="utf-8") as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write("\n")
          PY

            git add "$RUNTIME_QA_PROGRESS_PATH"
            if git diff --cached --quiet; then
              echo "No ledger delta to persist."
              exit 0
            fi
            git commit -m "qa: record $RUNTIME_QA_BLOCK_KEY public runtime result"
            if git push origin HEAD:main; then
              echo "Runtime QA ledger persisted successfully."
              exit 0
            fi
            echo "main advanced during persistence; retrying from latest origin/main."
            sleep $((attempt * 2))
          done

          echo "Failed to persist runtime QA ledger after 5 latest-main retries." >&2
          exit 1
      - name: Enforce browser QA result
        if: steps.browser_qa.outcome != 'success'
        run: exit 1
