name: Import finalized drum from Dropbox

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-final-drum-from-dropbox.yml"

permissions:
  contents: write

jobs:
  import-drum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download exact finalized PNG from Dropbox
        env:
          DRUM_URL: "https://uc1a83262215ff78ec9571335fda.dl.dropboxusercontent.com/cd/0/get/DIQ2lBRwVoD8LX0Xy9u35-3v6l4CJEGybNehA2WYQSxqqsQ5EGW7TksjpgAVE8RsEWXqibnbI6FHaHiHM253rP86kT4fUfyy4l2l9m2hFTi0AQvxfhAiiBUndRlbxpzu1bTXP7OMgeFKPufmCBrJaC0f7W37TcdJMdcvuhGKky8ePw/file?c_luid=e8a8ea13"
        run: |
          mkdir -p character-assets/layers/drum
          curl --fail --location --silent --show-error "$DRUM_URL" -o character-assets/layers/drum/drum_base.png
      - name: Verify PNG bytes and pixels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          p=Path('character-assets/layers/drum/drum_base.png')
          b=p.read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          assert sha == '554c9817ddff8f296f3d278f999d359201c8d53980535021408cedf82cf2d8be', sha
          assert len(b) == 2038286, len(b)
          im=Image.open(p).convert('RGBA')
          assert im.size == (1448,1086), im.size
          pixel_sha=hashlib.sha256(im.tobytes()).hexdigest()
          assert pixel_sha == 'e536b66a5a4afda4778b0801362526db30903f159057091106316c28abf8e0df', pixel_sha
          assert im.getchannel('A').getextrema()[0] < 255
          print('verified', sha, pixel_sha, im.size)
          PY
      - name: Commit and push finalized drum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/drum/drum_base.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "assets: finalize corrected 11-lane drum layer"
          git push
