name: Visual Integrity Batch Prep

on:
  push:
    branches: [main]
    paths:
      - "character-assets/edit-workspaces/character-brushup-20260919/BRUSHUP_LEDGER.json"
      - "character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json"
      - "character-assets/layers/character/**"
      - "character-assets/layers/drum/drum_base.png"
      - "tools/character_layers/prepare_visual_integrity_batch.py"
      - ".github/workflows/visual-integrity-batch-prep.yml"
      - ".github/back-visual-actions.txt"
      - ".github/front-visual-actions.txt"
  workflow_dispatch:
    inputs:
      actions:
        description: "One or two comma-separated action keys; blank = use active claimed batch, else auto-select"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Select batch and build QA evidence
        env:
          ACTIONS: ${{ inputs.actions }}
        shell: bash
        run: |
          # Explicit queue override is authoritative only when that queue file
          # is the file changed by this commit. This keeps FRONT and BACK sessions
          # independent; ordinary ledger CLAIM commits fall through to the ledger.
          CHANGED="$(git show --pretty= --name-only HEAD)"
          if [ -z "$ACTIONS" ] && [ -f .github/front-visual-actions.txt ] && grep -Fxq ".github/front-visual-actions.txt" <<< "$CHANGED"; then
            ACTIONS="$(tr -d '\r\n' < .github/front-visual-actions.txt)"
          elif [ -z "$ACTIONS" ] && [ -f .github/back-visual-actions.txt ] && grep -Fxq ".github/back-visual-actions.txt" <<< "$CHANGED"; then
            ACTIONS="$(tr -d '\r\n' < .github/back-visual-actions.txt)"
          fi
          if [ -n "$ACTIONS" ]; then
            python tools/character_layers/prepare_visual_integrity_batch.py --actions "$ACTIONS" --out visual-qa/current-batch
          else
            python tools/character_layers/prepare_visual_integrity_batch.py --out visual-qa/current-batch
          fi
      - name: Show selected batch
        run: cat visual-qa/current-batch/batch_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: visual-integrity-batch-prep-${{ github.run_id }}
          path: visual-qa/current-batch/
          retention-days: 30
