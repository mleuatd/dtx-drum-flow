name: Import staged character asset from Dropbox

on:
  workflow_dispatch:
    inputs:
      staging_path:
        description: "Repository path to one staging JSON"
        required: true
        default: "character-assets/staging/sn_l_hit.json"
  push:
    branches: [main]
    paths:
      - "character-assets/staging/**/*.json"

permissions:
  contents: write

jobs:
  import-character-asset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resolve staging JSON paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.staging_path }}" > /tmp/staging_paths.txt
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep '^character-assets/staging/.*\.json$' \
              | sort -u > /tmp/staging_paths.txt
          fi
          test -s /tmp/staging_paths.txt
          echo "Staging files:"
          cat /tmp/staging_paths.txt

      - name: Validate staging JSON
        shell: bash
        run: |
          mapfile -t STAGING_PATHS < /tmp/staging_paths.txt
          node tools/validate-character-import-staging.mjs "${STAGING_PATHS[@]}"

      - name: Download exact bytes, verify SHA256 and register assets
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        shell: bash
        run: |
          mapfile -t STAGING_PATHS < /tmp/staging_paths.txt
          python tools/import_character_asset_from_dropbox.py "${STAGING_PATHS[@]}"

      - name: Commit and push imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             character-assets/layers             character-assets/config/assets_manifest.json             character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json             character-assets/prototypes/luna_say_maybe_16m/M1_4_REQUIRED_CHARACTER_ASSETS.json             character-assets/staging
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "assets: import staged character assets from Dropbox"
          git pull --rebase origin main
          git push origin HEAD:main
