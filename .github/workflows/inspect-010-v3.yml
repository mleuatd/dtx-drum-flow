name: Inspect 010 v3 artifact
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-010-v3.yml"
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact v3 visual QA inputs
        uses: actions/upload-artifact@v4
        with:
          name: inspect-010-v3
          if-no-files-found: error
          compression-level: 0
          path: |
            character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v3.png
            character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_fixed_drum_v3_review.webp
            character-assets/generation-trials/mesh-warp-010-v1/010_before_after_v3_review.webp
