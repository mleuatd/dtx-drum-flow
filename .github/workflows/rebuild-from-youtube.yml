name: Rebuild chart from YouTube reference

on:
  push:
    paths:
      - "validation/video_reference/REQUEST.txt"
      - ".github/workflows/rebuild-from-youtube.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          python -m pip install opencv-python-headless mido numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Read request
        id: request
        shell: bash
        run: |
          URL="$(sed -n '1p' validation/video_reference/REQUEST.txt | tr -d '\r')"
          BPM="$(sed -n '2p' validation/video_reference/REQUEST.txt | tr -d '\r')"
          [ -n "$BPM" ] || BPM="139.675"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "bpm=$BPM" >> "$GITHUB_OUTPUT"

      - name: Download reference video transiently
        shell: bash
        run: |
          mkdir -p _reference
          URL='${{ steps.request.outputs.url }}'
          set +e
          yt-dlp --no-playlist --merge-output-format mp4 \
            -f "bv*[height<=1080]+ba/b[height<=1080]" \
            -o "_reference/reference.%(ext)s" "$URL"
          RC=$?
          if [ $RC -ne 0 ]; then
            yt-dlp --no-playlist --extractor-args "youtube:player_client=android_vr,web_safari" \
              --merge-output-format mp4 \
              -f "bv*[height<=1080]+ba/b[height<=1080]" \
              -o "_reference/reference.%(ext)s" "$URL"
            RC=$?
          fi
          if [ $RC -ne 0 ]; then
            yt-dlp --no-playlist --extractor-args "youtube:player_client=tv_embedded" \
              --merge-output-format mp4 \
              -f "b[height<=720]/best[height<=720]" \
              -o "_reference/reference.%(ext)s" "$URL"
            RC=$?
          fi
          exit $RC

      - name: Normalize downloaded video filename
        shell: bash
        run: |
          FILE="$(find _reference -maxdepth 1 -type f | head -n 1)"
          test -n "$FILE"
          ffmpeg -y -i "$FILE" -map 0:v:0 -map 0:a? -c:v copy -c:a aac _reference/reference.mp4

      - name: Extract DTX chart from video
        run: |
          mkdir -p validation/video_reference/output
          python tools/audio_pipeline/video_chart_extractor.py \
            _reference/reference.mp4 \
            -o validation/video_reference/output \
            --bpm '${{ steps.request.outputs.bpm }}'

      - name: Record source metadata
        shell: bash
        run: |
          {
            echo "source_url=${{ steps.request.outputs.url }}"
            echo "bpm=${{ steps.request.outputs.bpm }}"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 _reference/reference.mp4 | sed 's/^/video_duration_sec=/'
          } > validation/video_reference/output/source.txt

      - name: Upload derived chart only
        uses: actions/upload-artifact@v4
        with:
          name: luna-say-maybe-video-chart
          path: |
            validation/video_reference/output/video_notes.json
            validation/video_reference/output/video_chart.mid
            validation/video_reference/output/video_chart.dtx
            validation/video_reference/output/source.txt
          if-no-files-found: error
          retention-days: 14
