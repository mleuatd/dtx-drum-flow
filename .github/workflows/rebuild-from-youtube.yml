name: Rebuild chart from YouTube reference

on:
  push:
    paths:
      - "validation/video_reference/REQUEST.txt"
      - ".github/workflows/rebuild-from-youtube.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          python -m pip install opencv-python-headless mido numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Read request
        id: request
        shell: bash
        run: |
          URL="$(sed -n '1p' validation/video_reference/REQUEST.txt | tr -d '\r')"
          BPM="$(sed -n '2p' validation/video_reference/REQUEST.txt | tr -d '\r')"
          [ -n "$BPM" ] || BPM="139.675"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "bpm=$BPM" >> "$GITHUB_OUTPUT"

      - name: Download reference video transiently
        shell: bash
        run: |
          mkdir -p _reference
          URL='${{ steps.request.outputs.url }}'
          VIDEO_ID="$(python - <<'PY'
import re
u = """${{ steps.request.outputs.url }}"""
m = re.search(r'(?:youtu\.be/|[?&]v=)([A-Za-z0-9_-]{11})', u)
if not m:
    raise SystemExit("Could not parse YouTube video id")
print(m.group(1))
PY
)"
          set +e
          yt-dlp --no-playlist --merge-output-format mp4 \
            -f "bv*[height<=1080]+ba/b[height<=1080]" \
            -o "_reference/reference.%(ext)s" "$URL"
          RC=$?

          if [ $RC -ne 0 ]; then
            echo "Direct YouTube access failed; trying Piped public API proxies."
            export VIDEO_ID
            STREAM_URL="$(python - <<'PY'
import json, os, urllib.request
video_id=os.environ["VIDEO_ID"]
instances=[
 "https://pipedapi.kavin.rocks",
 "https://pipedapi.leptons.xyz",
 "https://pipedapi.nosebs.ru",
 "https://pipedapi-libre.kavin.rocks",
 "https://pipedapi.adminforge.de",
 "https://api.piped.yt",
 "https://api.piped.private.coffee",
 "https://pipedapi.darkness.services",
]
for base in instances:
    try:
        req=urllib.request.Request(
            f"{base}/streams/{video_id}",
            headers={"User-Agent":"Mozilla/5.0"}
        )
        with urllib.request.urlopen(req, timeout=20) as r:
            data=json.load(r)
        streams=[s for s in data.get("videoStreams",[]) if s.get("url")]
        if not streams:
            continue
        def score(s):
            h=int(s.get("height") or 0)
            mp4=1 if "mp4" in str(s.get("mimeType","")).lower() else 0
            return (1 if h<=1080 else 0, min(h,1080), mp4, int(s.get("bitrate") or 0))
        streams.sort(key=score, reverse=True)
        print(streams[0]["url"])
        raise SystemExit(0)
    except SystemExit:
        raise
    except Exception as e:
        print(f"{base}: {e}", file=os.sys.stderr)
raise SystemExit(1)
PY
)"
            if [ -n "$STREAM_URL" ]; then
              curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" \
                "$STREAM_URL" -o _reference/reference.mp4
              RC=$?
            fi
          fi

          exit $RC

      - name: Normalize downloaded video filename
        shell: bash
        run: |
          FILE="$(find _reference -maxdepth 1 -type f | head -n 1)"
          test -n "$FILE"
          ffmpeg -y -i "$FILE" -map 0:v:0 -map 0:a? -c:v copy -c:a aac _reference/reference.mp4

      - name: Extract DTX chart from video
        run: |
          mkdir -p validation/video_reference/output
          python tools/audio_pipeline/video_chart_extractor.py \
            _reference/reference.mp4 \
            -o validation/video_reference/output \
            --bpm '${{ steps.request.outputs.bpm }}'

      - name: Record source metadata
        shell: bash
        run: |
          {
            echo "source_url=${{ steps.request.outputs.url }}"
            echo "bpm=${{ steps.request.outputs.bpm }}"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 _reference/reference.mp4 | sed 's/^/video_duration_sec=/'
          } > validation/video_reference/output/source.txt

      - name: Upload derived chart only
        uses: actions/upload-artifact@v4
        with:
          name: luna-say-maybe-video-chart
          path: |
            validation/video_reference/output/video_notes.json
            validation/video_reference/output/video_chart.mid
            validation/video_reference/output/video_chart.dtx
            validation/video_reference/output/source.txt
          if-no-files-found: error
          retention-days: 14
