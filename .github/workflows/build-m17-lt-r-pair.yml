name: Build M17 LT R pair

on:
  push:
    branches: [main]
    paths:
      - "character-assets/generation-staging/m17-lt-r.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Build deterministic LT:R pair
        run: python tools/build-m17-lt-r-pair.py
      - name: Run candidate QA
        run: |
          python tools/character_candidate_qa.py character-assets/layers/character/lt/hit_r_refresh.png --neutral character-assets/layers/character/base/neutral.png --out character-assets/generated-qa/m17-lt-r/hit-qa.json
          python tools/character_candidate_qa.py character-assets/layers/character/lt/rebound_r_refresh.png --neutral character-assets/layers/character/base/neutral.png --out character-assets/generated-qa/m17-lt-r/rebound-qa.json
          python tools/build-character-qa-preview.py --neutral character-assets/layers/character/base/neutral.png --hit character-assets/layers/character/lt/hit_r_refresh.png --rebound character-assets/layers/character/lt/rebound_r_refresh.png --drum character-assets/layers/drum/drum_base.png --contacts character-assets/prototypes/luna_say_maybe_16m/INSTRUMENT_CONTACT_POINTS.json --parts LT --out-dir character-assets/generated-qa/m17-lt-r/preview
      - name: Mirror exact pair to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          token=os.environ.get("DROPBOX_ACCESS_TOKEN")
          if not token: raise SystemExit("DROPBOX_ACCESS_TOKEN required")
          assets=[
            ("character-assets/layers/character/lt/hit_r_refresh.png","/ChatGPT/dtx-drum-flow/lt_r_hit_refresh_20260919.png"),
            ("character-assets/layers/character/lt/rebound_r_refresh.png","/ChatGPT/dtx-drum-flow/lt_r_rebound_refresh_20260919.png")
          ]
          mirror=[]
          for src,dbx in assets:
              raw=pathlib.Path(src).read_bytes(); sha=hashlib.sha256(raw).hexdigest()
              req=urllib.request.Request("https://content.dropboxapi.com/2/files/upload",data=raw,method="POST",headers={"Authorization":f"Bearer {token}","Content-Type":"application/octet-stream","Dropbox-API-Arg":json.dumps({"path":dbx,"mode":"overwrite","autorename":False,"mute":True})})
              with urllib.request.urlopen(req) as r: meta=json.loads(r.read().decode())
              mirror.append({"repoPath":src,"dropboxPath":dbx,"sha256":sha,"dropboxFileId":meta.get("id"),"dropboxRev":meta.get("rev")})
          p=pathlib.Path("character-assets/generated-qa/m17-lt-r/dropbox-mirror.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({"status":"MIRRORED","assets":mirror},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit generated pair and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character/lt character-assets/generated-qa/m17-lt-r
          git commit -m "assets: build M17 LT R hit rebound"
          git pull --rebase origin main
          git push origin HEAD:main
