name: Build M17 LT R pair

on:
  push:
    branches: [main]
    paths:
      - "character-assets/generation-staging/m17-lt-r.json"
  pull_request:
    branches: [main]
    paths:
      - "character-assets/generation-staging/m17-lt-r.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Build deterministic LT:R pair
        run: python tools/build-m17-lt-r-pair.py
      - name: Run candidate QA
        run: |
          python tools/character_candidate_qa.py character-assets/layers/character/lt/hit_r_refresh.png --neutral character-assets/layers/character/base/neutral.png --out character-assets/generated-qa/m17-lt-r/hit-qa.json
          python tools/character_candidate_qa.py character-assets/layers/character/lt/rebound_r_refresh.png --neutral character-assets/layers/character/base/neutral.png --out character-assets/generated-qa/m17-lt-r/rebound-qa.json
          python tools/build-character-qa-preview.py --neutral character-assets/layers/character/base/neutral.png --hit character-assets/layers/character/lt/hit_r_refresh.png --rebound character-assets/layers/character/lt/rebound_r_refresh.png --drum character-assets/layers/drum/drum_base.png --contacts character-assets/prototypes/luna_say_maybe_16m/INSTRUMENT_CONTACT_POINTS.json --parts LT --out-dir character-assets/generated-qa/m17-lt-r/preview
      - name: Record Dropbox mirror pending
        run: |
          mkdir -p character-assets/generated-qa/m17-lt-r
          cat > character-assets/generated-qa/m17-lt-r/dropbox-mirror.json <<'JSON'
          {
            "status": "PENDING_MAIN_PUSH",
            "reason": "Pull-request workflows do not receive Dropbox secrets. Exact bytes will be mirrored after merge by the main-push mirror workflow."
          }
          JSON
      - name: Commit generated pair and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character/lt character-assets/generated-qa/m17-lt-r
          git commit -m "assets: build M17 LT R hit rebound"
          TARGET_BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
