name: Visual Integrity Batch Runtime QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-integrity-batch-runtime-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://mleuatd.github.io/dtx-drum-flow/
      MEASURE_START: "1"
      MEASURE_END: "148"
      QA_ACTIONS: "BD+RD:RF/R,BD+RC+SN:RF/R/L,BD+HT:RF/R"
      RUNTIME_QA_BLOCK_KEY: "BACK-VISUAL-RUNTIME-BATCH-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run public runtime transition QA
        id: browser_qa
        continue-on-error: true
        run: node tools/runtime-character-qa.mjs
      - name: Run explicit neutral-hit-rebound-neutral QA
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";
          import path from "node:path";

          const url=process.env.PUBLIC_URL;
          const targets=process.env.QA_ACTIONS.split(",").map(x=>x.trim()).filter(Boolean);
          const chart=JSON.parse(await fs.readFile("site/charts/luna_say_maybe/Luna_say_maybe_FINAL_notes.json","utf8"));
          const limbs=JSON.parse(await fs.readFile("site/charts/luna_say_maybe/Luna_say_maybe_full_limbs.json","utf8"));
          const inv=JSON.parse(await fs.readFile("character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json","utf8"));
          const limbMap=new Map((limbs.assignments||[]).map(x=>[`${Number(x.time).toFixed(6)}|${x.part}`,x.limb]));
          const notes=(chart.notes||[]).map(n=>({...n,limb:limbMap.get(`${Number(n.time).toFixed(6)}|${n.part}`)||n.limb}));
          const groups=[]; for(const n of notes){const g=groups.at(-1);if(g&&Math.abs(n.time-g[0].time)<=.008)g.push(n);else groups.push([n]);}
          const exactKey=g=>{const a=[...g].sort((x,y)=>x.part.localeCompare(y.part));return a.length>1?a.map(n=>n.part).join("+")+":"+a.map(n=>n.limb).join("/"):a[0].part+":"+a[0].limb};
          const keyFor=g=>{const exact=exactKey(g);if(inv.runtimeFrameMap?.[exact])return exact;const parts=[...new Set(g.map(n=>n.part))].sort();const wildcard=parts.join("+")+":*";return inv.runtimeFrameMap?.[wildcard]?wildcard:exact};
          const hitEnd=Number(inv.motionTiming?.hitEndSeconds??.09), reboundEnd=Number(inv.motionTiming?.reboundEndSeconds??.17);
          const neutralFrame=inv.requiredFrames?.neutral?.path||"layers/character/base/neutral.png";
          const sequences=[];
          for(const target of targets){
            const candidates=groups.map((g,i)=>({g,key:keyFor(g),time:Number(g[0].time),measure:g[0].measure,next:Number(groups[i+1]?.[0]?.time??Infinity)})).filter(x=>x.key===target);
            if(!candidates.length) throw new Error("target action missing: "+target);
            // Isolate explicit sequence QA from unrelated chart events. A real
            // occurrence proves the action exists; the QA hook is then exercised in
            // a collision-free synthetic window so another note cannot mask rebound.
            const ev=[...candidates].sort((a,b)=>(b.next-b.time)-(a.next-a.time))[0];
            const qaBase=30+sequences.length*2;
            const neutralAfterTime=qaBase+reboundEnd+.012;
            const hitFrameId=inv.runtimePhaseFrameMap?.[target]?.hit||inv.runtimeFrameMap?.[target];
            const reboundFrameId=inv.runtimePhaseFrameMap?.[target]?.rebound||inv.runtimeFrameMap?.[target];
            sequences.push({target,ev,points:[
              {label:"neutral_before",time:0,phase:"neutral",key:"neutral",frame:neutralFrame},
              {label:"hit",time:qaBase+.012,phase:"hit",key:target,frame:inv.requiredFrames?.[hitFrameId]?.path},
              {label:"rebound",time:qaBase+hitEnd+(reboundEnd-hitEnd)*.48,phase:"rebound",key:target,frame:inv.requiredFrames?.[reboundFrameId]?.path},
              {label:"neutral_after",time:neutralAfterTime,phase:"neutral",key:"neutral",frame:neutralFrame}
            ]});
          }
          await fs.mkdir("qa-artifacts/explicit-sequence",{recursive:true});
          const browser=await chromium.launch({headless:true}); const records=[]; let failed=0;
          for(const vp of [{name:"pc",width:1280,height:900},{name:"xperia-portrait",width:384,height:864}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const page=await context.newPage();
            await page.goto(url+"?qa=1&explicit=1",{waitUntil:"networkidle",timeout:120000});
            await page.waitForFunction(()=>window.__DTX_APP_READY__===true,null,{timeout:45000});
            await page.waitForFunction(()=>window.__DTX_CHARACTER_QA__?.snapshot().ready===true,null,{timeout:45000});
            for(const {target,ev,points} of sequences) for(const p of points){
              await page.evaluate(time=>{const el=document.getElementById("timeline");el.value=String(time);el.dispatchEvent(new Event("input",{bubbles:true}))},p.time);
              await page.waitForTimeout(160);
              const a=await page.evaluate(()=>window.__DTX_CHARACTER_QA__.snapshot());
              const ok=a.animationKey===p.key&&a.phase===p.phase&&a.frame===p.frame&&a.character.complete&&a.drum.complete&&!a.assetWarning&&!a.initError;
              if(!ok) failed++;
              const shot=path.join("qa-artifacts","explicit-sequence",vp.name+"_"+p.label+".png");
              await page.locator(".stage").screenshot({path:shot});
              records.push({viewport:vp.name,target,measure:ev.measure,eventTime:ev.time,...p,actualKey:a.animationKey,actualPhase:a.phase,actualFrame:a.frame,status:ok?"PASS":"FAIL",screenshotPath:shot});
            }
            await context.close();
          }
          await browser.close();
          await fs.writeFile("qa-artifacts/explicit-sequence.json",JSON.stringify({targets,sequence:"neutral->hit->rebound->neutral",failed,passed:records.length-failed,records},null,2));
          if(failed) process.exit(1);
          JS
      - name: Upload transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-integrity-batch-runtime-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce QA result
        if: steps.browser_qa.outcome != 'success'
        run: exit 1
