name: FRONT MOTION-002 pair replacement
on:
  push:
    branches: [main]
    paths:
      - 'tools/character_layers/build_front_bd_rc_pair_replacement.py'
      - '.github/workflows/front-bd-rc-pair-replacement.yml'
      - 'character-assets/prototypes/luna_say_maybe_16m/FRONT_REPAIR_REQUEST.json'
      - '.github/front06-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Verify FRONT claim still owns MOTION-002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json")
          d=json.loads(p.read_text())
          x=next(v for v in d["defects"] if v["issueId"]=="MOTION-002")
          c=x.get("claim") or {}
          assert c.get("state")=="CLAIMED", c
          assert c.get("owner")=="CHATGPT-FRONT", c
          assert c.get("batch")=="HOLD-REPAIR-FRONT-06", c
          assert x.get("status")!="VERIFIED", x.get("status")
          PY
      - name: Build pair replacement candidate
        run: python tools/character_layers/build_front_bd_rc_pair_replacement.py
      - name: Upload FRONT06 evidence
        uses: actions/upload-artifact@v4
        with:
          name: front06-bd-rc-pair-replacement
          path: character-assets/edit-workspaces/motion-repair-20260920/front06/
      - name: Commit candidate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/edit-workspaces/motion-repair-20260920/front06/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: build FRONT06 BD+RC replacement candidate"
          git pull --rebase origin main
          git push origin HEAD:main
