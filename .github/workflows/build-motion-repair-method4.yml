name: Build motion repair method4 candidates
on:
  push:
    branches: [main]
    paths:
      - 'tools/character_layers/build_motion_repair_method4.py'
      - '.github/workflows/build-motion-repair-method4.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/character_layers/build_motion_repair_method4.py
      - name: Commit method4 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/edit-workspaces/motion-repair-20260920/method4/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: build RD-specific motion repair candidates"
          git push
