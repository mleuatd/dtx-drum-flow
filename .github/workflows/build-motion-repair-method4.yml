name: Build motion repair method4 candidates
on:
  push:
    branches: [main]
    paths:
      - 'tools/character_layers/build_motion_repair_method4.py'
      - 'character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json'
      - '.github/workflows/build-motion-repair-method4.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/character_layers/build_motion_repair_method4.py
      - name: Upload method4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: motion-repair-method4-${{ github.run_id }}
          path: character-assets/edit-workspaces/motion-repair-20260920/method4/
          retention-days: 30
      - name: Commit method4 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/edit-workspaces/motion-repair-20260920/method4/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: build claimed motion repair method4 candidates"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            git rebase --abort || true
            echo "Concurrent main update caused a real conflict; refusing to overwrite another terminal."
            exit 1
          done
          echo "Push remained busy after bounded retries."
          exit 1
