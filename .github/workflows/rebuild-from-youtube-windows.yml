name: Rebuild chart from YouTube reference Windows

on:
  push:
    paths:
      - "validation/video_reference/WINDOWS_TRIGGER.txt"
      - ".github/workflows/rebuild-from-youtube-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip yt-dlp opencv-python-headless mido numpy
      - name: Download reference video
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _reference | Out-Null
          python -m yt_dlp --no-playlist --js-runtimes node -f "b[ext=mp4][height<=720]/b[height<=720]/best" -o "_reference/reference.mp4" "https://youtu.be/RrBjACoZjD0?si=1hzur8YuqnGZer1d"
      - name: Extract chart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation/video_reference/output | Out-Null
          python tools/audio_pipeline/video_chart_extractor.py _reference/reference.mp4 -o validation/video_reference/output --bpm 139.675
      - name: Upload derived chart only
        uses: actions/upload-artifact@v4
        with:
          name: luna-say-maybe-video-chart-windows
          path: |
            validation/video_reference/output/video_notes.json
            validation/video_reference/output/video_chart.mid
            validation/video_reference/output/video_chart.dtx
          retention-days: 14