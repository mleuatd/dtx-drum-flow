name: integrate-live-drum-engine

on:
  push:
    branches: [main]
    paths:
      - "tools/integrate-live-drum-engine.py"
      - ".github/workflows/integrate-live-drum-engine.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate live drum engine
        run: python tools/integrate-live-drum-engine.py
      - name: Syntax check
        run: |
          node --check site/live-drum-engine.js
          node --check site/app.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js
          git diff --cached --quiet && exit 0
          git commit -m "audio: activate Luna live drum engine"
          git pull --rebase origin main
          git push origin HEAD:main
