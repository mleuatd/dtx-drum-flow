name: Build M18-24 deterministic character pairs

on:
  push:
    branches: [main]
    paths:
      - "character-assets/generation-staging/m18-24-deterministic-pairs.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install Pillow==12.3.0
      - name: Build M18-24 pairs
        run: python tools/build-m18-24-deterministic-pairs.py
      - name: Candidate QA
        run: |
          for f in character-assets/layers/character/combo/{bd_rd_rf_r,rd_sn_r_l,bd_hh_rf_r,hh_sn_r_l}_{hit,rebound}_refresh.png; do
            n=$(basename "$f" .png)
            python tools/character_candidate_qa.py "$f" --neutral character-assets/layers/character/base/neutral.png --out "character-assets/generated-qa/m18-24/$n-qa.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: m18-24-deterministic-pairs
          path: |
            character-assets/layers/character/combo/*_refresh.png
            character-assets/generated-qa/m18-24
      - name: Commit generated pairs and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character/combo character-assets/generated-qa/m18-24
          git commit -m "assets: build M18-24 deterministic pairs"
          git pull --rebase origin main
          git push origin HEAD:main
