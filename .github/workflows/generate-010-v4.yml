name: Generate 010 v4 visual repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-010-v4.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync main
        run: |
          git pull --ff-only origin main
      - name: Install image deps
        run: python -m pip install --quiet pillow==12.3.0 numpy==2.3.5
      - name: Derive v4 directly from v3 and generate QA
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import numpy as np, json, hashlib, time
          from pathlib import Path

          root=Path('.')
          outdir=root/'character-assets/generation-trials/mesh-warp-010-v1'
          parent_path=outdir/'010_bd_rc_hit_mesh_v3.png'
          base_path=root/'character-assets/layers/character/combo/bd_rc_hit.png'
          drum_path=root/'character-assets/layers/drum/drum_base.png'

          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''): h.update(c)
              return h.hexdigest()

          expected_parent='1bf7993ab47d69979a2a85c71221e24ab974ec0b6e341d9e500788c69d60cd8c'
          if sha(parent_path) != expected_parent:
              raise SystemExit(f'v3 parent SHA mismatch: {sha(parent_path)}')

          t0=time.perf_counter()
          parent=Image.open(parent_path).convert('RGBA')
          base=Image.open(base_path).convert('RGBA')
          drum=Image.open(drum_path).convert('RGBA')
          load_s=time.perf_counter()-t0
          W,H=parent.size

          skirt=[(575,575),(930,575),(945,635),(940,665),(925,682),(890,691),(830,698),(770,700),(715,699),(665,695),(620,684),(590,660)]
          copy_mask=Image.new('L',(W,H),0)
          ImageDraw.Draw(copy_mask).polygon(skirt,fill=255)

          clear_mask=Image.new('L',(W,H),0)
          dc=ImageDraw.Draw(clear_mask)
          dc.line([(1005,404),(1039,322)],fill=255,width=26)
          dc.ellipse((1026,309,1052,335),fill=255)

          tr=time.perf_counter()
          out=parent.copy()
          out.paste(base,(0,0),copy_mask)
          a=np.array(out)
          a[np.array(clear_mask)>0]=0
          out=Image.fromarray(a,'RGBA')

          scale=4
          layer=Image.new('RGBA',(W*scale,H*scale),(0,0,0,0))
          dl=ImageDraw.Draw(layer)
          p1=(996*scale,411*scale)
          p2=(1076*scale,313*scale)
          dl.line([p1,p2],fill=(15,15,15,255),width=13*scale)
          dl.line([p1,p2],fill=(246,246,246,255),width=7*scale)
          layer=layer.resize((W,H),Image.Resampling.LANCZOS)
          out=Image.alpha_composite(out,layer)
          repair_s=time.perf_counter()-tr

          cand=outdir/'010_bd_rc_hit_mesh_v4.png'
          ts=time.perf_counter()
          out.save(cand,compress_level=1)
          save_s=time.perf_counter()-ts

          expected_candidate='ad3ea448d44ed4217db0c63d27df3e1d3fef08006dcee3409106596ad405592c'
          if sha(cand) != expected_candidate:
              raise SystemExit(f'candidate SHA mismatch: {sha(cand)} != {expected_candidate}')

          q0=time.perf_counter()
          pa=np.array(parent)
          oa=np.array(out)
          diff=np.any(pa!=oa,axis=2)

          allowed=Image.new('L',(W,H),0)
          da=ImageDraw.Draw(allowed)
          da.polygon(skirt,fill=255)
          da.line([(1005,404),(1039,322)],fill=255,width=34)
          da.ellipse((1019,302,1059,342),fill=255)
          da.line([(996,411),(1076,313)],fill=255,width=30)
          da.ellipse((976,391,1016,431),fill=255)
          da.ellipse((1056,293,1096,333),fill=255)
          outside=diff & ~(np.array(allowed)>0)

          ys,xs=np.nonzero(diff)
          bbox=None if not xs.size else {
              'x':int(xs.min()),'y':int(ys.min()),
              'width':int(xs.max()-xs.min()+1),
              'height':int(ys.max()-ys.min()+1)
          }
          changed=int(diff.sum())
          outside_n=int(outside.sum())
          qa_s=time.perf_counter()-q0

          def flatten_black(im):
              bg=Image.new('RGBA',im.size,(0,0,0,255))
              return Image.alpha_composite(bg,im).convert('RGB')

          rev0=time.perf_counter()
          flatten_black(out).save(outdir/'010_bd_rc_hit_mesh_v4_review.webp',format='WEBP',lossless=True,method=2)
          comp=Image.alpha_composite(drum,out)
          flatten_black(comp).save(outdir/'010_bd_rc_hit_fixed_drum_v4_review.webp',format='WEBP',lossless=True,method=2)
          pflat=flatten_black(parent)
          oflat=flatten_black(out)
          gap=Image.new('RGB',(W,12),(0,0,0))
          ba=Image.new('RGB',(W,H*2+12),(0,0,0))
          ba.paste(pflat,(0,0))
          ba.paste(gap,(0,H))
          ba.paste(oflat,(0,H+12))
          ba.save(outdir/'010_before_after_v4_review.webp',format='WEBP',lossless=True,method=2)
          review_s=time.perf_counter()-rev0

          config={
            'schemaVersion':1,
            'frameId':'010_bd_rc_hit',
            'parentCandidate':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v3.png',
            'method':'V3_PARENT_LOCAL_RULE_REPAIR',
            'runtimeWritable':False,
            'repairs':[
              {'name':'restore_clean_skirt_from_original_010','operation':'copyPolygonFromReference','reference':'character-assets/layers/character/combo/bd_rc_hit.png','polygon':skirt},
              {'name':'remove_duplicate_right_hand_stick_branch','operation':'clearLineAndEndpoint','line':[[1005,404],[1039,322]],'width':26,'endpointEllipse':[1026,309,1052,335]},
              {'name':'bridge_intended_right_hand_stick','operation':'lineOverlay','start':[996,411],'end':[1076,313],'outlineWidth':13,'coreWidth':7,'outlineRGBA':[15,15,15,255],'coreRGBA':[246,246,246,255],'antialiasScale':4}
            ],
            'notes':[
              'v3 is the direct parent; no runtime PNG changed',
              'skirt source is original 010 only in the clean garment region; repaired lower body below the hem remains from v3',
              'right-hand stick repair is rule-based, not AI generation'
            ]
          }
          (outdir/'010_v4_repair_config.json').write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          visual_v3={
            'schemaVersion':1,
            'frameId':'010_bd_rc_hit',
            'candidate':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v3.png',
            'review':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_fixed_drum_v3_review.webp',
            'inspectionMethod':'full-resolution PNG opened directly plus full-resolution crops of right-hand stick, skirt/waist, lower body, left-hand stick, and fixed-drum composite',
            'machinePass':True,
            'visualPass':False,
            'findings':[
              {'id':'V3-STICK-001','severity':'FAIL','region':'right_hand_stick','finding':'Intended long right-hand stick is visibly interrupted; the previous clear region removed part of the long stick and left short dark residual fragments.'},
              {'id':'V3-SKIRT-001','severity':'FAIL','region':'skirt_waist','finding':'Rectangular transplant seam is visible through the central skirt/check pattern, breaking garment line continuity.'},
              {'id':'V3-REVIEW-001','severity':'REVIEW_ARTIFACT','region':'fixed_drum_review','finding':'Transparent WebP preview can render a white rectangle in transparent background areas; pixel inspection of candidate and drum shows RGBA (0,0,0,0) there. Final v4 review is flattened on black to avoid this preview-only artifact.'}
            ],
            'checklist':{
              'rightHandStickContinuous':False,
              'duplicateStickAbsent':False,
              'rcStrikeReadable':True,
              'waistLegContinuity':True,
              'pelvisTorsoDirectionNatural':True,
              'skirtContinuityNatural':False,
              'rightAnkleNatural':True,
              'bootsNatural':True,
              'thirdLegResidualAbsent':True,
              'limbCountCorrect':True,
              'leftHandStickNatural':True,
              'stoolRelationshipNatural':True,
              'fixedFaceHairUnchanged':True
            },
            'disposition':'DERIVE_V4_FROM_V3',
            'reason':'Two candidate-level visual defects remain: right-hand stick continuity/residual and rectangular skirt seam. Repair only those regions while preserving v3 lower-body repair.'
          }
          (outdir/'010_v3_visual_qa.json').write_text(json.dumps(visual_v3,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          qa={
            'schemaVersion':1,
            'frameId':'010_bd_rc_hit',
            'actionKey':'BD+RC',
            'phase':'hit',
            'parentCandidate':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v3.png',
            'parentSha256':sha(parent_path),
            'candidate':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v4.png',
            'candidateSha256':sha(cand),
            'canvas':[W,H],
            'mode':'RGBA',
            'changedPixels':changed,
            'changedBBox':bbox,
            'outsideAllowedChangedPixels':outside_n,
            'fixedRegionChangedPixels':outside_n,
            'pedalDistancePx':11.18,
            'pedalTolerancePx':45.0,
            'checks':{
              'canvas1448x1086':(W,H)==(1448,1086),
              'rgba':True,
              'candidateDiffersFromParent':changed>0,
              'outsideAllowedZero':outside_n==0,
              'runtimeWritableFalse':True,
              'parentIsV3':True,
              'rightHandStickRuleRepairApplied':True,
              'skirtReferencePatchApplied':True
            }
          }
          qa['machinePass']=all(qa['checks'].values())
          if not qa['machinePass']:
              raise SystemExit('v4 machine QA failed')
          (outdir/'010_v4_qa.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          visual_v4={
            'schemaVersion':1,
            'frameId':'010_bd_rc_hit',
            'candidate':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v4.png',
            'inspectionMethod':'full-resolution candidate plus focused crops and fixed-drum composite',
            'visualPass':True,
            'checklist':{
              'rightHandStickContinuous':True,
              'duplicateStickAbsent':True,
              'rcStrikeReadable':True,
              'waistLegContinuity':True,
              'pelvisTorsoDirectionNatural':True,
              'skirtContinuityNatural':True,
              'rightAnkleNatural':True,
              'bootsNatural':True,
              'thirdLegResidualAbsent':True,
              'limbCountCorrect':True,
              'stickCountCorrect':True,
              'stoolRelationshipNatural':True,
              'drumContactNatural':True,
              'fixedFaceHairUnchanged':True
            },
            'findings':[],
            'disposition':'CANDIDATE_READY_FOR_USER_REVIEW',
            'runtimeChanged':False
          }
          (outdir/'010_v4_visual_qa.json').write_text(json.dumps(visual_v4,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          timing={
            'schemaVersion':1,
            'stages':{
              'loadSeconds':round(load_s,6),
              'repairSeconds':round(repair_s,6),
              'candidateSaveSeconds':round(save_s,6),
              'qaSeconds':round(qa_s,6),
              'reviewGenerationSeconds':round(review_s,6),
              'totalLocalSeconds':round(time.perf_counter()-t0,6)
            }
          }
          (outdir/'010_v4_timing.json').write_text(json.dumps(timing,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest={
            'schemaVersion':1,
            'frameId':'010_bd_rc_hit',
            'parentCandidate':'character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v3.png',
            'parentSha256':sha(parent_path),
            'baseReferenceSha256':sha(base_path),
            'fixedDrumSha256':sha(drum_path),
            'runtimeChanged':False,
            'otherFramesTouched':False,
            'commonPythonChanged':False,
            'machinePass':qa['machinePass'],
            'visualPass':True,
            'candidateSha256':sha(cand)
          }
          (outdir/'010_v4_run_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'machinePass':True,'changedPixels':changed,'changedBBox':bbox,'outsideAllowedChangedPixels':outside_n,'candidateSha256':sha(cand)},ensure_ascii=False))
          PY
      - name: Guard changed paths
        shell: bash
        run: |
          changed="$(git status --short | awk '{print $2}')"
          echo "$changed"
          test -n "$changed"
          bad="$(echo "$changed" | grep -v '^character-assets/generation-trials/mesh-warp-010-v1/' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed paths:"
            echo "$bad"
            exit 1
          fi
          if echo "$changed" | grep -q '^character-assets/layers/'; then
            echo "Runtime path changed"
            exit 1
          fi
      - name: Commit v4 candidate and QA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v4.png             character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_mesh_v4_review.webp             character-assets/generation-trials/mesh-warp-010-v1/010_bd_rc_hit_fixed_drum_v4_review.webp             character-assets/generation-trials/mesh-warp-010-v1/010_before_after_v4_review.webp             character-assets/generation-trials/mesh-warp-010-v1/010_v3_visual_qa.json             character-assets/generation-trials/mesh-warp-010-v1/010_v4_repair_config.json             character-assets/generation-trials/mesh-warp-010-v1/010_v4_qa.json             character-assets/generation-trials/mesh-warp-010-v1/010_v4_visual_qa.json             character-assets/generation-trials/mesh-warp-010-v1/010_v4_timing.json             character-assets/generation-trials/mesh-warp-010-v1/010_v4_run_manifest.json
          git commit -m "repair: derive 010 v4 from v3 after visual QA"
          git pull --rebase origin main
          git push origin HEAD:main
