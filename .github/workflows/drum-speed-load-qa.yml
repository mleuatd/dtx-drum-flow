name: Drum Speed Load QA
on:
  push:
    branches: [main]
    paths: ['site/live-drum-engine.js','site/app.js','tools/drum-speed-load-browser-qa.mjs','.github/workflows/drum-speed-load-qa.yml']
  workflow_dispatch:
jobs:
  speed-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 -d site > /tmp/dtx-http.log 2>&1 & echo $! > /tmp/dtx-http.pid
      - run: node tools/drum-speed-load-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drum-speed-load-qa
          path: qa/runtime-audio/
