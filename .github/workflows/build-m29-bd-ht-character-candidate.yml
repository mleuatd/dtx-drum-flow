name: Build M29 BD+HT Character Candidate
on:
  push:
    paths:
      - tools/build-m29-bd-ht-r-pair.py
      - .github/workflows/build-m29-bd-ht-character-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build-m29-bd-ht-r-pair.py
      - name: Commit review candidate and QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/review-candidates/m29_40 character-assets/generated-qa/m29_40/bd_ht_rf_r
          git diff --cached --quiet && exit 0
          git commit -m "assets: build M29 BD+HT review candidate"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m29-bd-ht-character-candidate
          path: |
            character-assets/review-candidates/m29_40
            character-assets/generated-qa/m29_40/bd_ht_rf_r
