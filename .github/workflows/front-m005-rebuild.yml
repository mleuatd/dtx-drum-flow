name: FRONT complete MOTION-005 from verified donors
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/front-m005-rebuild.yml"
      - "tools/character_layers/build_front_m005.py"
      - "tools/character_layers/promote_front_m005.py"
      - ".github/front-m005-trigger.txt"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: front-m005
  cancel-in-progress: true
jobs:
  build-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Apply exact promotion against latest main with conflict-safe replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "M005 latest-main promotion attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          d=json.load(open("character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json"))
          x=next(v for v in d["defects"] if v["issueId"]=="MOTION-005")
          c=x.get("claim") or {}
          assert c.get("owner")=="CHATGPT-FRONT" and c.get("batch")=="FRONT-M005-AFTER-M007",c
          v=x.get("visualIntegrityQa") or {}; e=v.get("reviewEvidence") or {}
          assert v.get("humanAnatomy")=="PASS" and v.get("linework")=="PASS" and v.get("fixedDrumComposite")=="PASS" and not v.get("promotionBlocked"),v
          assert e.get("candidateHitSha256")=="8b1dcbf1d3287ee90bb4425380314fd412aeaeb407ccb1664815493f1cac6423"
          assert e.get("candidateReboundSha256")=="cd33610f79643b80222a250410eeaf2207be7d1014baa2f8847c9e611ba2ac6b"
          PY

            python tools/character_layers/build_front_m005.py
            python tools/character_layers/promote_front_m005.py
            python tools/character_layers/validate_assets.py
            python -m unittest discover -s tools/runtime_pose/tests -p 'test_*.py'

            git add               character-assets/layers/character/combo/bd_hh_rf_r_hit_refresh.png               character-assets/layers/character/combo/bd_hh_rf_r_rebound_refresh.png               character-assets/config/assets_manifest.json               character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json               character-assets/prototypes/luna_say_maybe_16m/ACTION_KEY_ASSET_MAP.json               character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json               character-assets/edit-workspaces/motion-repair-20260920/front-m005/M005_RUNTIME_QA_STATE.json
            git commit -m "repair: promote exact MOTION-005 verified-donor pair"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced; discard local commit and replay exact mutation on newest main."
            sleep $((attempt*2))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-m005-${{ github.run_id }}
          path: character-assets/edit-workspaces/motion-repair-20260920/front-m005/
          retention-days: 30
