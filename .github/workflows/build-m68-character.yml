name: Build M68 Character Pair

on:
  push:
    branches: [main]
    paths:
      - "tools/build-m68-bd-rc-sn-deterministic.py"
      - ".github/workflows/build-m68-character.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-m68-character
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build deterministic candidate pair
        run: python tools/build-m68-bd-rc-sn-deterministic.py
      - name: Upload M68 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: m68-character-candidate-${{ github.run_id }}
          path: |
            character-assets/review-candidates/m68/
            character-assets/generated-qa/m68/
          if-no-files-found: error
          retention-days: 30
      - name: Commit candidate and QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/review-candidates/m68 character-assets/generated-qa/m68
          if git diff --cached --quiet; then
            echo "No candidate delta."
            exit 0
          fi
          git commit -m "character: build M68 deterministic candidate"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to push M68 candidate after retries" >&2
          exit 1
