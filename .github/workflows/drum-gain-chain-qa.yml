name: Drum Gain Chain QA
on:
  push:
    branches: [main]
    paths:
      - 'site/live-drum-engine.js'
      - 'site/app.js'
      - 'tools/drum-gain-chain-qa.mjs'
      - '.github/workflows/drum-gain-chain-qa.yml'
  workflow_dispatch:
jobs:
  gain-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/drum-gain-chain-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drum-gain-chain-qa
          path: qa/gain-chain/
