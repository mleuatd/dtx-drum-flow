name: Temporary audio model bundle
on:
  push:
    branches: ["tmp/audio-restore-ai-20260927"]
    paths: ["temp/model_trigger.txt"]
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stacks
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio "audio-separator[cpu]" deepfilternet
      - name: Download weights and offline wheels
        run: |
          mkdir -p model_bundle/torchaudio model_bundle/audio_separator model_bundle/deepfilter model_bundle/wheels
          python - <<'PY'
          import shutil, pathlib, torchaudio
          b=torchaudio.pipelines.HDEMUCS_HIGH_MUSDB
          _=b.get_model()
          cache=pathlib.Path.home()/'.cache/torch/hub/torchaudio/models/hdemucs_high_musdbhq_only.pt'
          print(cache, cache.exists(), cache.stat().st_size if cache.exists() else 0)
          shutil.copy2(cache,'model_bundle/torchaudio/hdemucs_high_musdbhq_only.pt')
          PY
          audio-separator --download_model_only -m UVR-MDX-NET-Inst_HQ_3.onnx --model_file_dir model_bundle/audio_separator
          audio-separator --download_model_only -m model_bs_roformer_ep_317_sdr_12.9755.ckpt --model_file_dir model_bundle/audio_separator || true
          python - <<'PY'
          from df.enhance import init_df
          import pathlib, shutil
          _model, _state, _ = init_df()
          roots=[pathlib.Path.home()/'.cache', pathlib.Path.home()/'.local']
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file() and p.stat().st_size>10000 and ('deepfilter' in str(p).lower() or 'dfnet' in str(p).lower()):
                      dst=pathlib.Path('model_bundle/deepfilter')/p.name
                      if not dst.exists():
                          try: shutil.copy2(p,dst)
                          except Exception: pass
          PY
          python -m pip download --dest model_bundle/wheels --no-deps audio-separator onnxruntime
          python -m pip download --dest model_bundle/wheels deepfilternet
          python -m pip freeze > model_bundle/pip_freeze.txt
          find model_bundle -type f -printf '%p %s bytes\n' | tee model_bundle/files.txt
      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: audio-model-bundle
          path: model_bundle
          retention-days: 2
