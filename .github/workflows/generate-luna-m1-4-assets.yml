name: Generate Luna m1-4 assets
on:
  push:
    branches: [main]
    paths:
      - "tools/luna_m1_4_assets_part*.json"
      - "tools/generate_luna_m1_4_assets.py"
      - ".github/workflows/generate-luna-m1-4-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: "!startsWith(github.event.head_commit.message, 'assets: generate Luna m1-4 PNGs')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/generate_luna_m1_4_assets.py
      - name: Validate generated PNGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths=list(Path("character-assets/layers").rglob("*.png"))
          wanted=[p for p in paths if "drum_base.png" in str(p) or "character/" in str(p)]
          assert len(wanted)>=12, len(wanted)
          for p in wanted:
              im=Image.open(p)
              assert im.size==(1448,1086),(p,im.size)
              assert "A" in im.mode,(p,im.mode)
          print("validated",len(wanted))
          PY
      - name: Commit generated assets and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers character-assets/config/assets_manifest.json character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json site/app.js site/character-prototype.js site/index.html site/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: generate Luna m1-4 PNGs and metadata"
          git push
