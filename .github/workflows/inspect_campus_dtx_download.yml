name: Inspect Campus mode public DTX archive
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect_campus_dtx_download.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download publicly offered Campus mode chart archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install gdown
          gdown 'https://drive.google.com/uc?id=11Dz-4RD5E-zdr-iei3FqKek6mkZDxs1X' -O campus_download.bin --no-cookies
          ls -lh campus_download.bin
      - name: Inspect content without republishing third-party material
        shell: bash
        run: |
          python - <<'PY'
          import os,zipfile,re
          p='campus_download.bin'
          print('DOWNLOAD_BYTES',os.path.getsize(p))
          print('MAGIC',open(p,'rb').read(16).hex())
          if not zipfile.is_zipfile(p):
           print('NOT_ZIP_FORMAT')
           raise SystemExit(0)
          with zipfile.ZipFile(p) as z:
           listing=z.infolist()
           print('ZIP_ITEMS',len(listing))
           print('ZIP_TOTAL_UNCOMPRESSED',sum(x.file_size for x in listing))
           for item in listing:
            name=item.filename
            print('ITEM',repr(name),item.file_size)
           names=[x for x in listing if x.filename.lower().endswith(('.dtx','.gda','.bms','.bme','.mid','.midi','.txt','.md','.license')) and x.file_size<8_000_000]
           for item in names:
            raw=z.read(item)
            if raw[:2] in (bytes.fromhex('fffe'),bytes.fromhex('feff')) or raw[:120].count(0)>20:
             body=raw.decode('utf-16',errors='replace')
            else:
             body=raw.decode('utf-8',errors='replace')
             if body.count('\\ufffd')>20: body=raw.decode('cp932',errors='replace')
            print('INSPECT_FILE',repr(item.filename),'BYTES',item.file_size,'BOM_HEX',raw[:18].hex())
            print('FIRST_LINES',repr(body.splitlines()[:10]))
            if item.filename.lower().endswith(('.txt','.md','.license')):
             print('DOCUMENT_HEAD',body[:2200])
            if item.filename.lower().endswith(('.dtx','.gda','.bms','.bme')):
             for label in ['#TITLE','#ARTIST','#BPM','#PLAYLEVEL','#DLEVEL','#OFFSET','#WAV']:
              arr=[line[:200] for line in body.splitlines() if line.upper().startswith(label)]
              print('HEADER',label,arr[:3])
             notes=[line for line in body.splitlines() if re.match(r'^#\d{3}[0-9a-z]{2}:',line,re.I)]
             from collections import Counter
             c=Counter(line[4:6].upper() for line in notes)
             print('CHANNEL_COUNTS',dict(c))
             print('MEASURES',len({line[1:4] for line in notes}))
          PY

      - name: Convert three UTF-16 DTX scores into numeric drum chart events
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/public_dtx_chart_converter.py
          mkdir -p /tmp/campus_dtx site/charts/campus_mode
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile("campus_download.bin") as z:
              for code in ("bas","adv","ext"):
                  name=f"462 - Campus mode!!/campusmode!!-{code}.dtx"
                  data=z.read(name)
                  assert len(data)<1_000_000
                  pathlib.Path(f"/tmp/campus_dtx/{code}.dtx").write_bytes(data)
                  print("EXTRACTED_SCORE",code,len(data))
          PY
          for level in bas adv ext; do
            output="site/charts/campus_mode/campus_"$level"_notes.json"
            python tools/public_dtx_chart_converter.py "/tmp/campus_dtx/$level.dtx" "$output" --difficulty "$level" --source-url "https://dtx.furukon.com/?p=1&search=Campus%20mode"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          for code in ("bas","adv","ext"):
              p=Path(f"site/charts/campus_mode/campus_{code}_notes.json")
              data=json.loads(p.read_text())
              assert 200<data["duration"]<320, (code,data["duration"])
              assert data["bpm"]==183
              assert len(data["notes"])>=100
              assert data["notes"]==sorted(data["notes"],key=lambda n:(n["time"],n["part"]))
              print("VALIDATED",code,len(data["notes"]),data["duration"],data["measureCount"])
          PY
      - name: Publish note-timing JSON only (no original DTX, audio, or video)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/charts/campus_mode/campus_bas_notes.json site/charts/campus_mode/campus_adv_notes.json site/charts/campus_mode/campus_ext_notes.json
          if git diff --cached --quiet; then
            echo "Campus charts already up to date"
          else
            git commit -m "feat: integrate Campus mode three full DTX drum difficulties as metadata-only charts"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
