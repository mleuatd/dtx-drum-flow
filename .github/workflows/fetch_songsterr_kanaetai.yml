name: fetch-songsterr-kanaetai
on:
  push:
    paths: [".github/workflows/fetch_songsterr_kanaetai.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Songsterr APIs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          UA="dtx-drum-flow-personal-practice/1.0"
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/meta/2808958?allowOwnUnpublished=true" -o out/meta.json
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/meta/2808958/revisions" -o out/revisions.json
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/revision/3694097" -o out/revision.json
          python -m json.tool out/meta.json >/dev/null
          python -m json.tool out/revisions.json >/dev/null
          python -m json.tool out/revision.json >/dev/null
          python - <<'PY'
          import json, pathlib
          for name in ("meta.json","revisions.json","revision.json"):
              p=pathlib.Path("out")/name
              d=json.loads(p.read_text())
              print(name, type(d).__name__, list(d)[:30] if isinstance(d,dict) else f"len={len(d)}")
              if isinstance(d,dict):
                  for k in ("songId","revisionId","source","image","title","artist"):
                      if k in d: print(" ",k,repr(d[k]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songsterr-kanaetai-public
          path: out
          if-no-files-found: error
