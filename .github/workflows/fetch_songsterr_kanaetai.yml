name: fetch-songsterr-kanaetai
on:
  push:
    paths: [".github/workflows/fetch_songsterr_kanaetai.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Songsterr APIs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          UA="dtx-drum-flow-personal-practice/1.0"
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/meta/2808958?allowOwnUnpublished=true" -o out/meta.json
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/meta/2808958/revisions" -o out/revisions.json
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/revision/3694097" -o out/revision.json
          python -m json.tool out/meta.json >/dev/null
          python -m json.tool out/revisions.json >/dev/null
          python -m json.tool out/revision.json >/dev/null
          SOURCE=$(python -c 'import json; print(json.load(open("out/revision.json"))["source"])')
          echo "$SOURCE" > out/source-url.txt
          curl -fL --retry 3 -A "$UA" "$SOURCE" -o out/Kanaetai_songsterr_source.gp
          test -s out/Kanaetai_songsterr_source.gp
          python tools/songsterr_gp_to_chart.py out/Kanaetai_songsterr_source.gp site/charts/kanaetai_koto_bakari/Kanaetai_koto_bakari_FINAL_notes.json --track-index 3 --bpm 143 --duration 246
          python - <<'PY'
          import json, pathlib
          for name in ("meta.json","revisions.json","revision.json"):
              p=pathlib.Path("out")/name
              d=json.loads(p.read_text())
              print(name, type(d).__name__, list(d)[:30] if isinstance(d,dict) else f"len={len(d)}")
              if isinstance(d,dict):
                  for k in ("songId","revisionId","source","image","title","artist"):
                      if k in d: print(" ",k,repr(d[k]))
          PY
      - name: Commit generated FINAL chart
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/charts/kanaetai_koto_bakari/Kanaetai_koto_bakari_FINAL_notes.json
          if git diff --cached --quiet; then
            echo "FINAL chart already up to date"
          else
            git commit -m "feat: add Kanaetai Koto Bakari FINAL drum chart"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songsterr-kanaetai-public
          path: out
          if-no-files-found: error
