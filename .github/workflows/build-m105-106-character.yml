name: Build M105-106 Character Pairs

on:
  push:
    branches: [main]
    paths:
      - "tools/build-m105-106-deterministic-pairs.py"
      - ".github/workflows/build-m105-106-character.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-m105-106-character
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build deterministic candidate pairs
        run: python tools/build-m105-106-deterministic-pairs.py
      - name: Record build run metadata
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("character-assets/generated-qa/m105_106/workflow-run.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          run=os.environ["GITHUB_RUN_ID"]
          data={"runId":int(run),"artifactName":f"m105-106-character-candidates-{run}","headSha":os.environ["GITHUB_SHA"]}
          p.write_text(json.dumps(data,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: m105-106-character-candidates-${{ github.run_id }}
          path: |
            character-assets/review-candidates/m105_106/
            character-assets/generated-qa/m105_106/
          if-no-files-found: error
          retention-days: 30
      - name: Commit candidate and QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/review-candidates/m105_106 character-assets/generated-qa/m105_106
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "character: build M105-106 deterministic candidates"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
