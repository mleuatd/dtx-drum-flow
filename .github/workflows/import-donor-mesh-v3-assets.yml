name: import-donor-mesh-v3-assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-donor-mesh-v3-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified V3 overlay PNGs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="character-assets/versions/donor-mesh-v3"
          OUT="$ROOT/overlays/combo"
          TMP="$(mktemp -d)"
          mkdir -p "$OUT"

          fetch_one() {
            local url="$1" expected="$2" dest="$3"
            curl --fail --silent --show-error --location --retry 2 --retry-delay 1 "$url" -o "$TMP/$dest"
            printf '%s  %s\n' "$expected" "$TMP/$dest" | sha256sum -c -
          }

          fetch_one 'https://uc6f5c7ca222d4f079836035748b.dl.dropboxusercontent.com/cd/0/get/DIjm1yrf308E7fOtjPtpRtjpXcux8IfXApAeC-VzkaFbuo_B52E0M3MkD4gCr8L4-WVlXwfwKvXz36S-eKORZWFFxpjmr4thJyn9Sg3-rAkAmZW5Qk9gR5NPeW22_9ZRBaVJET2gzf111HrQsq35fRNdih57xUK1Wg2t_wM41uMpJA/file?c_luid=e8a8ea13' '67b8cba2ce9a65e3ac923a789775bbdc48b0f71e73b701d0bae4e0c9435a4ee9' 'bd_hh_sn_rf_r_l_hit_refresh.png'
          fetch_one 'https://uc6ad4535aaad78d8d35fdd416ef.dl.dropboxusercontent.com/cd/0/get/DIgR7DtMsRS0ajbsz7lPKJfWjuNwQlo2hupyOBJVdr3Fc3k1eRki9-9BdA20LnS9J15pfUU5PkoosL717E1lzkjQQxc3HSm0LYlDX-ujGKnrowg5Y_rJHh2JrqzW3knjZgj3WkdILWdTagRGkZNPEE_-7dK8KOkZ3qV9B4nGzE8jiw/file?c_luid=e8a8ea13' 'cf3ef1dd8c70ff5a493501fd8466c756e3f33fddf41d12317947daf92e86dfc2' 'bd_rc_sn_rf_r_l_hit_refresh.png'
          fetch_one 'https://uccdcbcdc379f9f14eefaa403624.dl.dropboxusercontent.com/cd/0/get/DIjWTeR2mm6Yk3N7uVY_VI3OxZIJaAkEhm5Mn-vitopu0ThcKICdu0tEf1oifVS6324xAqjEhCFjBk0LEKP4mjkR25JDaToIvjDbdj6wgtmGiTD10poXXp3plR6-m_ah2QCq4_pIpwP6A65RyCzP7zbp9o3upWCGljFSau7eNSxUrw/file?c_luid=e8a8ea13' 'e823ffdcac3220225d28590711736a2d9e53ffeadf4d9b09a6f96a66e173e694' 'bd_rd_rf_r_hit_refresh.png'
          fetch_one 'https://uc5e9cd247b95fdf0c1e1fd91443.dl.dropboxusercontent.com/cd/0/get/DIj0MunK8PvdKp1qSx6k_5b5upkKkKjdneIiY_UNnKq0ft_xfhZefCs-hXjBapTLvbTpbK14aGFh5ZEMpt8qRXY5Y0y6N6VTU9mJhvZG1VDsaaiWKvVM_on7dG3CSZFOY49TYDem6XEW7XnOCd8R9---d_O5MgylzFyxRv8dqCuMwQ/file?c_luid=e8a8ea13' '55401042db40f8915542e335ee594aa3f7cdba6a1904f36e2eb2c5de48d31c31' 'hh_sn_r_l_rebound_refresh.png'

          install -m 0644 "$TMP/bd_hh_sn_rf_r_l_hit_refresh.png" "$OUT/bd_hh_sn_rf_r_l_hit_refresh.png"
          install -m 0644 "$TMP/bd_rc_sn_rf_r_l_hit_refresh.png" "$OUT/bd_rc_sn_rf_r_l_hit_refresh.png"
          install -m 0644 "$TMP/bd_rd_rf_r_hit_refresh.png" "$OUT/bd_rd_rf_r_hit_refresh.png"
          install -m 0644 "$TMP/hh_sn_r_l_rebound_refresh.png" "$OUT/hh_sn_r_l_rebound_refresh.png"

          cat > "$ROOT/checksums.sha256" <<'EOF'
67b8cba2ce9a65e3ac923a789775bbdc48b0f71e73b701d0bae4e0c9435a4ee9  overlays/combo/bd_hh_sn_rf_r_l_hit_refresh.png
cf3ef1dd8c70ff5a493501fd8466c756e3f33fddf41d12317947daf92e86dfc2  overlays/combo/bd_rc_sn_rf_r_l_hit_refresh.png
e823ffdcac3220225d28590711736a2d9e53ffeadf4d9b09a6f96a66e173e694  overlays/combo/bd_rd_rf_r_hit_refresh.png
55401042db40f8915542e335ee594aa3f7cdba6a1904f36e2eb2c5de48d31c31  overlays/combo/hh_sn_r_l_rebound_refresh.png
EOF

          cat > "$ROOT/manifest.json" <<'EOF'
{
  "schemaVersion": 1,
  "versionId": "DONOR-MESH-V3",
  "label": "統合親＋予備修正版",
  "baseCommit": "a4e3854449e292264192afa63469edf0fb5048af",
  "runtimePolicy": "baseline character set plus verified overlay PNGs",
  "overlays": [
    {"path":"combo/bd_hh_sn_rf_r_l_hit_refresh.png","issueId":"DMR-012","status":"RESERVE_PASS"},
    {"path":"combo/bd_rc_sn_rf_r_l_hit_refresh.png","issueId":"DMR-017","status":"RESERVE_PASS"},
    {"path":"combo/bd_rd_rf_r_hit_refresh.png","issueId":"DMR-018","status":"RESERVE_PASS"},
    {"path":"combo/hh_sn_r_l_rebound_refresh.png","source":"PRE15 merged explicit full-resolution PASS","status":"PASS"}
  ]
}
EOF

      - name: Commit imported binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/versions/donor-mesh-v3
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "assets: import donor mesh v3 verified PNG overlays"
          git push origin HEAD:main

