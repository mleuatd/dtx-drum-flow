name: Render SN-L rebound exact-parent AI candidate
on:
  push:
    branches: [main]
    paths:
      - ".github/sn-l-rebound-ai-trigger.txt"
      - ".github/workflows/render-sn-l-rebound-ai-candidate.yml"
      - "tools/image_edit/sn_l_rebound_explicit_edit.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-sn-l-rebound-ai-candidate
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: character-assets/layers/character/base/neutral.png
      CONSTRAINTS: character-assets/reference-models/luna_video_20260919/runtime_pose_constraints/SN_L_rebound_V1.json
      OUTDIR: character-assets/edit-workspaces/motion-repair-20260920/m001_ai_rebound
      QADIR: character-assets/edit-workspaces/motion-repair-20260920/m001_ai_rebound/qa
      DRUM: character-assets/layers/drum/drum_base.png
      HIT: character-assets/layers/character/sn/hit_l.png
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/character_layers/requirements.txt
      - run: python -m pip install --disable-pip-version-check pillow

      - name: Verify active FRONT claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json").read_text())
          x=next(v for v in d["defects"] if v["issueId"]=="MOTION-001")
          c=x.get("claim") or {}
          assert x.get("status")=="IN_FIX", x.get("status")
          assert c.get("state")=="CLAIMED" and c.get("owner")=="CHATGPT-FRONT" and c.get("batch")=="FRONT-M001-FASTPIPE", c
          PY

      - name: Prepare exact-parent rebound mask and prompt
        run: |
          mkdir -p "$OUTDIR" "$QADIR" /tmp/sn_l_rebound_ai
          python tools/image_edit/sn_l_rebound_explicit_edit.py prepare             --source "$SOURCE" --constraints "$CONSTRAINTS"             --mask /tmp/sn_l_rebound_ai/mask.png             --prompt /tmp/sn_l_rebound_ai/prompt.txt

      - name: Call exact-parent image edit API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            printf '{"status":"BLOCKED","reason":"OPENAI_API_KEY secret unavailable","issueId":"MOTION-001","actionKey":"SN:L","phase":"rebound"}\n' > "$QADIR/API_AUTH_STATUS.json"
            exit 20
          fi
          PROMPT="$(cat /tmp/sn_l_rebound_ai/prompt.txt)"
          http_code=$(curl -sS -o /tmp/sn_l_rebound_ai/response.json -w '%{http_code}'             -X POST "https://api.openai.com/v1/images/edits"             -H "Authorization: Bearer $OPENAI_API_KEY"             -F "model=gpt-image-2"             -F "image[]=@$SOURCE;type=image/png"             -F "mask=@/tmp/sn_l_rebound_ai/mask.png;type=image/png"             -F "prompt=$PROMPT"             -F "size=1448x1086"             -F "quality=medium"             -F "output_format=png")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            python - <<'PY'
          import json, pathlib
          raw=pathlib.Path("/tmp/sn_l_rebound_ai/response.json").read_text(errors="replace")
          pathlib.Path("character-assets/edit-workspaces/motion-repair-20260920/m001_ai_rebound/qa/API_AUTH_STATUS.json").write_text(
            json.dumps({"status":"BLOCKED","reason":"image edit API non-2xx","response":raw[:4000]},indent=2)+"\n")
          PY
            exit 21
          fi
          python - <<'PY'
          import base64,json,pathlib
          j=json.loads(pathlib.Path("/tmp/sn_l_rebound_ai/response.json").read_text())
          pathlib.Path("/tmp/sn_l_rebound_ai/api_output.png").write_bytes(base64.b64decode(j["data"][0]["b64_json"]))
          PY

      - name: Finalize candidate and deterministic QA
        run: |
          python tools/image_edit/sn_l_rebound_explicit_edit.py finalize             --source "$SOURCE" --mask /tmp/sn_l_rebound_ai/mask.png             --api-output /tmp/sn_l_rebound_ai/api_output.png             --output "$OUTDIR/candidate.png"
          python tools/image_edit/sn_l_rebound_explicit_edit.py qa             --source "$SOURCE" --mask /tmp/sn_l_rebound_ai/mask.png             --candidate "$OUTDIR/candidate.png" --constraints "$CONSTRAINTS"             --qa "$QADIR/QA.json"
          cp /tmp/sn_l_rebound_ai/mask.png "$QADIR/edit_mask.png"
          cp /tmp/sn_l_rebound_ai/prompt.txt "$QADIR/prompt.txt"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, hashlib
          out=Path("character-assets/edit-workspaces/motion-repair-20260920/m001_ai_rebound")
          hit=Image.open("character-assets/layers/character/sn/hit_l.png").convert("RGBA")
          reb=Image.open(out/"candidate.png").convert("RGBA")
          neutral=Image.open("character-assets/layers/character/base/neutral.png").convert("RGBA")
          drum=Image.open("character-assets/layers/drum/drum_base.png").convert("RGBA")
          Image.alpha_composite(drum,reb).save(out/"candidate_fixed_drum.png")
          frames=[neutral,hit,reb,neutral]
          strip=Image.new("RGBA",(1448*4,1086),(255,255,255,255))
          for i,f in enumerate(frames):
              comp=Image.alpha_composite(drum,f)
              strip.alpha_composite(comp,(1448*i,0))
          strip.thumbnail((1920,360))
          strip.convert("RGB").save(out/"transition_strip.jpg",quality=94)
          q=json.loads((out/"qa/QA.json").read_text())
          q["evidence"]=["candidate.png","candidate_fixed_drum.png","transition_strip.jpg"]
          (out/"qa/QA.json").write_text(json.dumps(q,indent=2)+"\n")
          PY

      - name: Upload full-resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m001-sn-l-rebound-ai-${{ github.run_id }}
          path: |
            /tmp/sn_l_rebound_ai/
            character-assets/edit-workspaces/motion-repair-20260920/m001_ai_rebound/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit candidate evidence only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTDIR"
          git diff --cached --quiet && exit 0
          git commit -m "image-edit: add MOTION-001 exact-parent rebound candidate"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt*2))
          done
          exit 1
