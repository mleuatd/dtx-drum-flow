name: FRONT refine MOTION-004 v2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/front-m004-refine-v2.yml"
      - "tools/character_layers/refine_front_m004_v2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: front-m004-refine-v2
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Verify FRONT claim
        run: |
          python - <<'PY'
          import json
          d=json.load(open("character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json"))
          x=next(v for v in d["defects"] if v["issueId"]=="MOTION-004")
          c=x.get("claim") or {}
          assert c.get("owner")=="CHATGPT-FRONT" and c.get("batch")=="FRONT-M004-FASTPIPE", c
          PY
      - name: Rebuild v1 parent locally
        env:
          CLAIM_OWNER: CHATGPT-FRONT
          ACTION_KEYS: RC+SN:R/L
        run: python tools/character_layers/build_active_motion_repair_candidates.py
      - name: Refine only diagnosed v1 defects
        run: python tools/character_layers/refine_front_m004_v2.py
      - name: Upload v2 full-resolution evidence
        uses: actions/upload-artifact@v4
        with:
          name: front-m004-v2-${{ github.run_id }}
          path: character-assets/edit-workspaces/motion-repair-20260920/front-m004-v2/
          retention-days: 30
