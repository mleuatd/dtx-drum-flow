name: Export HH R hit history audit

on:
  push:
    branches: [main]
    paths:
      - "character-assets/history-audit/hh-r-hit/REQUEST.json"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/character_layers/export_hh_r_history.py
      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/history-audit/hh-r-hit
          git commit -m "audit: export HH R hit history composites"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: hh-r-hit-history-audit
          path: character-assets/history-audit/hh-r-hit
          retention-days: 30
