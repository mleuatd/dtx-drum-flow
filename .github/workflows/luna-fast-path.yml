name: Luna Fast Path

on:
  workflow_dispatch:
    inputs:
      measure_start: {description: "First measure", required: true, default: "1"}
      measure_end: {description: "Last measure", required: true, default: "8"}

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Select path
        run: |
          node tools/luna-production-path.mjs "${{ inputs.measure_start }}" "${{ inputs.measure_end }}" path.json
          grep -q '"path": "FAST_PATH"' path.json
      - name: Build block checklist
        run: node tools/build-block-start-checklist.mjs "${{ inputs.measure_start }}" "${{ inputs.measure_end }}" block.json
      - name: Build QA sampling/risk
        run: node tools/build-qa-sampling-and-risk.mjs "${{ inputs.measure_start }}" "${{ inputs.measure_end }}" sampling.json
      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: luna-fast-path-plan
          path: |
            path.json
            block.json
            sampling.json
