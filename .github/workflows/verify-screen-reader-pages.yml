name: Verify Screen Reader Assist Pages mirror
on:
  workflow_run:
    workflows: [ "deploy-site" ]
    types: [ completed ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify standalone accessibility demo and settings routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mleuatd.github.io/dtx-drum-flow/screen-reader-assist'
          for file in index.html demo.html demo.js demo.css demo-logic.mjs app.js settings.js style.css; do
            url="$BASE/$file"
            echo "Fetching $url"
            curl --fail --location --silent --show-error --retry 15 --retry-delay 4 --retry-all-errors --max-time 40 -o "/tmp/sra-$file" "$url"
            test -s "/tmp/sra-$file"
          done
          grep -q '無料お試し体験' /tmp/sra-demo.html
          grep -q '漫画の吹き出し' /tmp/sra-demo.html
          grep -q 'インストールせずに体験する' /tmp/sra-index.html
          grep -q 'demo-logic.mjs' /tmp/sra-demo.js
          echo "Screen Reader Assist public GitHub Pages browser preview verified."
