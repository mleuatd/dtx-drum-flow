name: 008 mesh-warp regression

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/character_layers/**"
      - "character-assets/generation-trials/mesh-warp-008-v1/**"
      - "character-assets/config/mesh_warp_fast_lossless_v1.json"
      - "character-assets/prototypes/luna_say_maybe_16m/MESH_WARP_SPEED_STANDARD.md"
      - "character-assets/prototypes/luna_say_maybe_16m/EFFICIENT_VISUAL_REPAIR_WORKFLOW.md"
      - ".github/workflows/008-mesh-warp-regression.yml"

permissions:
  contents: write

jobs:
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scipy

      - name: Verify or run 008 regression
        shell: bash
        run: |
          set -euo pipefail
          OUT="character-assets/generation-trials/mesh-warp-008-v1"
          CFG="$OUT/008_mesh_config.json"
          RUNTIME="character-assets/layers/character/bd/hit_rf.png"
          MARKER="$OUT/008_regression_run.json"

          if [ -f "$MARKER" ]; then
            python - <<'PY'
import json
from pathlib import Path
out=Path("character-assets/generation-trials/mesh-warp-008-v1")
qa=json.loads((out/"008_qa.json").read_text())
reg=json.loads((out/"008_regression_run.json").read_text())
assert qa["machinePass"] is True
assert qa["outsideAllowedChangedPixels"] == 0
assert qa["fixedRegionChangedPixels"] == 0
assert qa["canvas"] == [1448,1086]
assert qa["mode"] == "RGBA"
assert reg["runtimeModified"] is False
assert reg["otherFramesTouched"] is False
assert reg["visualQaRequired"] is True
assert reg["userApprovalStatus"] != "APPROVED"
for name in [
  "008_bd_rf_hit_mesh_v1.png",
  "008_bd_rf_hit_mesh_v1_review.webp",
  "008_bd_rf_hit_fixed_drum_v1_review.webp",
  "008_before_after_review.webp",
  "008_timing.json",
  "008_run_manifest.json",
  "008_commit_manifest.json",
]:
    assert (out/name).exists(), name
print("committed 008 regression artifacts verified")
PY
            exit 0
          fi

          runtime_before="$(sha256sum "$RUNTIME" | awk '{print $1}')"

          python - <<'PY'
import hashlib,json
from pathlib import Path
cfgp=Path("character-assets/generation-trials/mesh-warp-008-v1/008_mesh_config.json")
cfg=json.loads(cfgp.read_text())
def sh(path):
    h=hashlib.sha256()
    with Path(path).open("rb") as f:
        for b in iter(lambda:f.read(1024*1024),b""):
            h.update(b)
    return h.hexdigest()
cfg["brokenSourceSha256"]=sh(cfg["inputPng"])
cfg["fixedDrumSha256"]=sh(cfg["fixedDrumPng"])
cfgp.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n")
PY

          python tools/character_layers/run_visual_repair_trial.py             --frame-config "$CFG"             --source character-assets/layers/character/bd/rebound_rf.png             --broken-source "$RUNTIME"             --fixed-drum character-assets/layers/drum/drum_base.png             --output-dir "$OUT"

          runtime_after="$(sha256sum "$RUNTIME" | awk '{print $1}')"
          test "$runtime_before" = "$runtime_after"

          python - <<'PY'
import json,subprocess
from pathlib import Path
out=Path("character-assets/generation-trials/mesh-warp-008-v1")
qa=json.loads((out/"008_qa.json").read_text())
assert qa["machinePass"] is True
assert qa["changedPixels"] == 36721
assert qa["changedBBox"] == {"x":594,"y":635,"width":172,"height":326}
assert qa["outsideAllowedChangedPixels"] == 0
assert qa["fixedRegionChangedPixels"] == 0
assert abs(float(qa["pedalDistancePx"])-11.18) <= 0.01
assert qa["canvas"] == [1448,1086] and qa["mode"] == "RGBA"
changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
assert not any(p.startswith("character-assets/layers/character/") for p in changed), changed
assert not any(any(tok in Path(p).name for tok in ("010","014","028","032")) for p in changed), changed
print("008 regression machine QA PASS")
PY

      - name: Commit first regression outputs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          OUT="character-assets/generation-trials/mesh-warp-008-v1"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --             "$OUT/008_mesh_config.json"             "$OUT/008_bd_rf_hit_mesh_v1.png"             "$OUT/008_bd_rf_hit_mesh_v1_review.webp"             "$OUT/008_bd_rf_hit_fixed_drum_v1_review.webp"             "$OUT/008_before_after_review.webp"             "$OUT/008_qa.json"             "$OUT/008_timing.json"             "$OUT/008_run_manifest.json"             "$OUT/008_commit_manifest.json"             "$OUT/008_regression_run.json"

          staged="$(git diff --cached --name-only)"
          echo "$staged"
          if echo "$staged" | grep -E '^character-assets/layers/character/'; then
            echo "runtime path detected" >&2; exit 1
          fi
          if echo "$staged" | grep -E '(^|/)(010|014|028|032)[^/]*'; then
            echo "other frame detected" >&2; exit 1
          fi

          git commit -m "test: record 008 fast pipeline regression"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
