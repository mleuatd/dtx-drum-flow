name: Import final M1-4 posefix batch from Dropbox

on:
  pull_request:
    branches: [main]
    paths:
      - "character-assets/staging/posefix_import_trigger_20260918.txt"

permissions:
  contents: write

jobs:
  import-final-posefix-batch:
    if: github.event.pull_request.head.ref == 'posefix-import-trigger-20260918'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Import exact approved batch from Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          from PIL import Image

          stage_paths = [
              'character-assets/staging/posefix_20260918_hh_r_rebound.json',
              'character-assets/staging/posefix_20260918_bd_rf_rebound.json',
              'character-assets/staging/posefix_20260918_hh_r_hit.json',
              'character-assets/staging/posefix_20260918_sn_r_rebound.json',
              'character-assets/staging/posefix_20260918_bd_rc_rebound.json',
          ]

          token = os.environ.get('DROPBOX_ACCESS_TOKEN')

          manifest_path = pathlib.Path('character-assets/config/assets_manifest.json')
          inv_path = pathlib.Path('character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json')
          req_path = pathlib.Path('character-assets/prototypes/luna_say_maybe_16m/M1_4_REQUIRED_CHARACTER_ASSETS.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          inv = json.loads(inv_path.read_text(encoding='utf-8'))
          req = json.loads(req_path.read_text(encoding='utf-8'))

          for stage_name in stage_paths:
              stage_path = pathlib.Path(stage_name)
              stage = json.loads(stage_path.read_text(encoding='utf-8'))
              key = stage['assetKey']
              expected = stage['sha256']
              if token:
                  req_dl = urllib.request.Request(
                      'https://content.dropboxapi.com/2/files/download',
                      method='POST',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Dropbox-API-Arg': json.dumps({'path': stage['dropboxPath']}),
                      },
                  )
              else:
                  url = stage.get('downloadUrl')
                  if not url:
                      raise SystemExit(f"{key}: DROPBOX_ACCESS_TOKEN or temporary downloadUrl is required")
                  req_dl = urllib.request.Request(url, method='GET')
              with urllib.request.urlopen(req_dl) as r:
                  raw = r.read()
              source_sha = hashlib.sha256(raw).hexdigest()
              if source_sha != expected:
                  raise SystemExit(f'{key}: SHA mismatch {source_sha} != {expected}')

              tmp = pathlib.Path('/tmp') / f'{key}.png'
              tmp.write_bytes(raw)
              im = Image.open(tmp)
              if im.format != 'PNG':
                  raise SystemExit(f'{key}: not PNG')
              if im.size != (int(stage['width']), int(stage['height'])):
                  raise SystemExit(f'{key}: size mismatch {im.size}')
              rgba = im.convert('RGBA')
              if rgba.getchannel('A').getextrema()[0] >= 255:
                  raise SystemExit(f'{key}: no transparency')

              target = pathlib.Path(stage['githubPath'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)

              found = False
              for a in manifest.get('assets', []):
                  if a.get('path') == stage['githubPath']:
                      a.update({
                          'sha256': expected,
                          'width': stage['width'],
                          'height': stage['height'],
                          'part': stage['part'],
                          'phase': stage['phase'],
                          'hand': stage.get('limb'),
                          'status': 'M1_4_READY',
                      })
                      found = True
                      break
              if not found:
                  manifest.setdefault('assets', []).append({
                      'path': stage['githubPath'],
                      'width': stage['width'], 'height': stage['height'],
                      'x': 0, 'y': 0, 'sha256': expected,
                      'status': 'M1_4_READY',
                      'purpose': 'Luna measures 1-4 final posefix variant',
                      'part': stage['part'], 'phase': stage['phase'],
                      'hand': stage.get('limb'), 'notes': []
                  })

              rel = stage['githubPath'].removeprefix('character-assets/')
              inv.setdefault('requiredFrames', {}).setdefault(key, {}).update({
                  'path': rel, 'state': 'ready', 'sha256': expected
              })
              runtime_key = stage.get('runtimeKey')
              if runtime_key:
                  inv.setdefault('runtimePhaseFrameMap', {}).setdefault(runtime_key, {})[stage['phase']] = key
                  if stage['phase'] == 'hit':
                      inv.setdefault('runtimeFrameMap', {})[runtime_key] = key

              for item in req['assets']:
                  if item['requiredAssetKey'] == key:
                      item.update({
                          'status': 'READY_GITHUB',
                          'sha256': expected,
                          'width': stage['width'],
                          'height': stage['height'],
                          'dropboxPath': stage['dropboxPath'],
                      })
                      break

              stage['status'] = 'IMPORTED'
              stage['importedSha256'] = expected
              stage.pop('downloadUrl', None)
              stage_path.write_text(json.dumps(stage, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('verified/imported', key, expected)

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          inv_path.write_text(json.dumps(inv, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          req_path.write_text(json.dumps(req, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          proto = pathlib.Path('site/character-prototype.js')
          text = proto.read_text(encoding='utf-8')
          import re
          text = re.sub(r'const ASSET_VERSION="[^"]+";', 'const ASSET_VERSION="20260918-m1-4-posefix-final-r1";', text)
          proto.write_text(text, encoding='utf-8')

          changelog = pathlib.Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          note = (
              "- Replaced the final approved M1-4 character pose variants from Dropbox "
              "(hh_r_hit, hh_r_rebound, bd_rf_rebound, sn_r_rebound, bd_rc_rebound), "
              "preserving the approved upper-body direction while using the final natural lower-body mechanics; "
              "updated manifests/inventory/staging and bumped the character asset cache version.\n"
          )
          if note not in c:
              marker = "## 2026-09-18\n"
              c = c.replace(marker, marker + note, 1) if marker in c else note + c
              changelog.write_text(c, encoding='utf-8')
          PY
      - name: Commit and push exact approved batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character character-assets/config/assets_manifest.json character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json character-assets/prototypes/luna_say_maybe_16m/M1_4_REQUIRED_CHARACTER_ASSETS.json character-assets/staging/posefix_20260918_*.json site/character-prototype.js CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "assets: import final M1-4 posefix batch"
          git push origin HEAD:main
