name: Promote motion repair method4 passes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-motion-repair-method4.yml'
      - 'tools/character_layers/promote_motion_repair_method4.py'
      - 'character-assets/edit-workspaces/motion-repair-20260920/method4/**'
      - 'character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/character_layers/promote_motion_repair_method4.py
      - run: python tools/character_layers/validate_assets.py
      - run: python -m unittest discover -s tools/runtime_pose/tests -p 'test_*.py'
      - name: Commit method4 promotions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/layers/character/ character-assets/config/assets_manifest.json character-assets/prototypes/luna_say_maybe_16m/asset_inventory.json character-assets/prototypes/luna_say_maybe_16m/ACTION_KEY_ASSET_MAP.json character-assets/edit-workspaces/character-brushup-20260919/BRUSHUP_LEDGER.json character-assets/prototypes/luna_say_maybe_16m/MOTION_DEFECT_BACKLOG.json character-assets/edit-workspaces/motion-repair-20260920/method4/METHOD4_PROMOTION_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: promote guarded RD motion repair candidates"
          git pull --rebase origin main
          git push origin HEAD:main
