name: Register RC:R stool-normalized candidate
on:
  push:
    paths:
      - .github/workflows/rc-stool-candidate-register.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify candidate
        env:
          SOURCE_URL: "https://ucae0d8c90cd1938954168355771.dl.dropboxusercontent.com/cd/0/get/DIo5oI-Xhj5uje1nsGGz68ym0d_bYfeJLxpouMVeoFmA_z2-KOshl1soeckW9tXUODxQbI1SOm5cIHYlFQKzA19gJ5viDjVcjPQfr3iZAYRaUyIDhDH3rlGEtQfmHcXS3Hw4XYDeFtrcZfgbxLq0Zng4mnfRoW6vGGLas6dn_pAJMA/file?c_luid=e8a8ea13"
        run: |
          set -euo pipefail
          mkdir -p character-assets/generation-trials/rc-r-stool-normalization
          curl -L --fail --silent --show-error "$SOURCE_URL" -o /tmp/rc_r_hit_stool_normalized_candidate.png
          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path
          p=Path("/tmp/rc_r_hit_stool_normalized_candidate.png")
          b=p.read_bytes()
          got=hashlib.sha256(b).hexdigest()
          exp="9669ddaf4745a8757dbbdac333c0767903df003b5f7fe9cba6ad639644836ff3"
          if got!=exp: raise SystemExit(f"sha256 mismatch: {got}")
          if b[:8] != b"\x89PNG\r\n\x1a\n": raise SystemExit("not PNG")
          w,h=struct.unpack(">II",b[16:24])
          if (w,h)!=(1448,1086): raise SystemExit(f"size mismatch: {(w,h)}")
          Path("character-assets/generation-trials/rc-r-stool-normalization/rc_r_hit_stool_normalized_candidate.png").write_bytes(b)
          PY
      - name: Write QA record
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = r'''
          {
            "schemaVersion": 1,
            "actionKey": "RC:R",
            "phase": "hit",
            "status": "QA_PASS_CANDIDATE_NOT_RUNTIME_PROMOTED",
            "method": "HH_APPROVED_STOOL_CLEAN_PIXEL_TRANSPLANT_WITH_CHAIR_ONLY_SYMMETRIC_OCCLUSION_FILL",
            "parent": {
              "githubPath": "character-assets/generation-trials/rc-r-chair-alignment/rc_r_hit_chair_aligned_to_hh.png",
              "githubCommit": "31781e5556110c4409aa10354554b3f22b816fde",
              "sha256": "848a06a301167e81ed18c59ff013a2bd48d62e92f8724adde0430484648cada4",
              "canvas": [
                1448,
                1086
              ]
            },
            "hhApprovedReference": {
              "sha256": "279ecfcc881c582f4aed5800fb6fabea544b4dda1b0b1d5f38fe34a3fc697cd2",
              "status": "USER_APPROVED_HIT_COMPLETE"
            },
            "candidate": {
              "path": "character-assets/generation-trials/rc-r-stool-normalization/rc_r_hit_stool_normalized_candidate.png",
              "sha256": "9669ddaf4745a8757dbbdac333c0767903df003b5f7fe9cba6ad639644836ff3",
              "canvas": [
                1448,
                1086
              ],
              "mode": "RGBA",
              "candidateCommit": null
            },
            "transformation": {
              "imageGenerationAI": false,
              "rescale": false,
              "rotate": false,
              "meshWarp": false,
              "transplant": true,
              "source": "HH approved actual pixels",
              "chairOnlyOcclusionFill": "mirror of approved HH right-side chair pixels around stool center x=802; applied to chair only"
            },
            "geometry": {
              "stoolCenterX": 802,
              "seatVisibleTargetApprox": {
                "centerX": 805.5,
                "centerY": 701,
                "widthPx": 292,
                "heightPx": 53,
                "bbox": [
                  660,
                  675,
                  952,
                  728
                ]
              },
              "postTarget": {
                "centerX": 802,
                "centerY": 779.5,
                "bbox": [
                  760,
                  720,
                  845,
                  840
                ]
              },
              "lowerChairTargetCleanBBox": [
                600,
                720,
                1005,
                1031
              ]
            },
            "pixelQa": {
              "changedBBox": [
                599,
                671,
                1019,
                1045
              ],
              "changedPixelCount": 64162,
              "outsideAllowedChangedPixels": 0,
              "fixedRegionChangedPixels": 0,
              "protectedRoiChangedPixels": {
                "headFaceHair": 0,
                "rightArmHandRcStick": 0,
                "leftArmHandStick": 0,
                "torsoJacketSkirtUpper": 0,
                "leftLegBoot": 0,
                "chairSideRightLegBootProtectedPolygons": 0
              }
            },
            "visualQa": {
              "seatCenterAligned": true,
              "seatWidthShapeNormalizedToHH": true,
              "seatThicknessNormalizedToHH": true,
              "postCenterAligned": true,
              "seatPostConnectionChecked": true,
              "chairLegSpreadNormalizedToHH": true,
              "personContactChecked": true,
              "skirtOverlapPreserved": true,
              "rcPosePreserved": true,
              "rightArmStickPreserved": true,
              "result": "PASS"
            },
            "formalRuntimeAssetModified": false,
            "currentStatusModified": false,
            "note": "Candidate only. Existing DMR-009 HH:R USER_APPROVED_HIT_COMPLETE and formal runtime are not overwritten."
          }
          '''.strip() + "\n"
          Path("character-assets/generation-trials/rc-r-stool-normalization/rc_r_hit_stool_normalized_candidate_qa.json").write_text(text, encoding="utf-8")
          PY
      - name: Commit candidate and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc-stool-candidate-register.yml
          git add character-assets/generation-trials/rc-r-stool-normalization/rc_r_hit_stool_normalized_candidate.png
          git add character-assets/generation-trials/rc-r-stool-normalization/rc_r_hit_stool_normalized_candidate_qa.json
          git commit -m "assets: add RC:R stool-normalized hit candidate"
          git push origin HEAD:main
