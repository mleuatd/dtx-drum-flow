name: Register RC:R aligned parent
on:
  push:
    paths:
      - .github/workflows/rc-parent-register.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact translated PNG
        env:
          SOURCE_URL: "https://uc31f74cfb8a6379089f9934d7bf.dl.dropboxusercontent.com/cd/0/get/DIq8TU0ynGZI9hVqYH6o9pnZXacqJnAZ1bk3fn_AcQXDCg8gvE2DxO6nIV5su60OMdDe0zzJvLu1lrS2dqXY_eR5I-2JxzoHvK_ZjGMi0ISbmI3v8Xo3ALID_y54cVpwHy3c1Pnvn11imYbI0fRJeyExHT2CFA4YWRMZN4_nor-cbg/file?c_luid=e8a8ea13"
        run: |
          set -euo pipefail
          mkdir -p character-assets/generation-trials/rc-r-chair-alignment
          curl -L --fail --silent --show-error "$SOURCE_URL" -o /tmp/rc_r_hit_chair_aligned_to_hh.png
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          src = Path("/tmp/rc_r_hit_chair_aligned_to_hh.png")
          data = src.read_bytes()
          got = hashlib.sha256(data).hexdigest()
          expected = "848a06a301167e81ed18c59ff013a2bd48d62e92f8724adde0430484648cada4"
          if got != expected:
              raise SystemExit(f"sha256 mismatch: {got}")
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("not PNG")
          w, h = struct.unpack(">II", data[16:24])
          if (w, h) != (1448, 1086):
              raise SystemExit(f"size mismatch: {(w,h)}")
          out = Path("character-assets/generation-trials/rc-r-chair-alignment/rc_r_hit_chair_aligned_to_hh.png")
          out.write_bytes(data)
          meta = {
            "schemaVersion": 1,
            "actionKey": "RC:R",
            "phase": "hit",
            "role": "REGISTERED_PARENT_FOR_STOOL_NORMALIZATION",
            "source": {
              "image": "5305.png",
              "sourceSha256": "017c3d97acbe261d298afb9dd24b826d65b0e7896107cb0ba899219cb1ff4dc3"
            },
            "image": {
              "path": out.as_posix(),
              "sha256": got,
              "width": w,
              "height": h,
              "mode": "RGBA"
            },
            "canvas": {"width": 1448, "height": 1086},
            "translation": {"dx": 52, "dy": -14},
            "transformation": "TRANSLATION_ONLY",
            "rescale": False,
            "rotate": False,
            "meshWarp": False,
            "imageGenerationAI": False,
            "purpose": "align RC:R stool position to user-approved HH:R stool registration",
            "hhReference": {
              "sha256": "279ecfcc881c582f4aed5800fb6fabea544b4dda1b0b1d5f38fe34a3fc697cd2",
              "status": "USER_APPROVED_HIT_COMPLETE"
            },
            "status": "REGISTERED_PARENT_FOR_STOOL_NORMALIZATION",
            "formalRuntimeAssetModified": False
          }
          Path("character-assets/generation-trials/rc-r-chair-alignment/rc_r_hit_chair_aligned_to_hh.json").write_text(
            json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Commit registered parent and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc-parent-register.yml
          git add character-assets/generation-trials/rc-r-chair-alignment/rc_r_hit_chair_aligned_to_hh.png
          git add character-assets/generation-trials/rc-r-chair-alignment/rc_r_hit_chair_aligned_to_hh.json
          git commit -m "assets: register chair-aligned RC:R hit parent"
          git push origin HEAD:main
