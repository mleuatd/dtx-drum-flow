name: fetch-songsterr-ittai
on:
  push:
    paths: [".github/workflows/fetch_songsterr_ittai.yml", "tools/songsterr_gp_to_chart.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Songsterr source and build FINAL chart
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out site/charts/ittai_itsukara
          UA="dtx-drum-flow-personal-practice/1.0"
          SONG_ID=3705140
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/meta/$SONG_ID?allowOwnUnpublished=true" -o out/meta.json
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/meta/$SONG_ID/revisions" -o out/revisions.json
          python -m json.tool out/meta.json >/dev/null
          python -m json.tool out/revisions.json >/dev/null
          REVISION_ID=$(python - <<'PY'
          import json
          meta=json.load(open("out/meta.json"))
          revs=json.load(open("out/revisions.json"))
          for key in ("revisionId","currentRevisionId","latestRevisionId"):
              if isinstance(meta,dict) and isinstance(meta.get(key),(int,str)):
                  print(meta[key]); raise SystemExit
          seq=revs if isinstance(revs,list) else revs.get("revisions",[]) if isinstance(revs,dict) else []
          for item in seq:
              if isinstance(item,dict):
                  for key in ("revisionId","id"):
                      if isinstance(item.get(key),(int,str)):
                          print(item[key]); raise SystemExit
          raise SystemExit("revision id not found")
          PY
          )
          echo "$REVISION_ID" > out/revision-id.txt
          curl -fL --retry 3 -A "$UA" "https://www.songsterr.com/api/revision/$REVISION_ID" -o out/revision.json
          python -m json.tool out/revision.json >/dev/null
          SOURCE=$(python -c 'import json; print(json.load(open("out/revision.json"))["source"])')
          echo "$SOURCE" > out/source-url.txt
          curl -fL --retry 3 -A "$UA" "$SOURCE" -o out/Ittai_itsukara_songsterr_source.gp
          test -s out/Ittai_itsukara_songsterr_source.gp
          python tools/songsterr_gp_to_chart.py out/Ittai_itsukara_songsterr_source.gp site/charts/ittai_itsukara/Ittai_itsukara_FINAL_notes.json \
            --track-index 3 --bpm 175 --duration 254 --name "一体いつから - Drums" --artist "月村手毬" \
            --song-id "$SONG_ID" --revision-id "$REVISION_ID"
          python - <<'PY'
          import json, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          gp=Path("out/Ittai_itsukara_songsterr_source.gp")
          with zipfile.ZipFile(gp) as zf:
              root=ET.fromstring(zf.read("Content/score.gpif"))
          tracks=[]
          for i,t in enumerate(list(root.find("Tracks") or [])):
              tracks.append({"index":i,"name":t.findtext("Name") or ""})
          chart=json.load(open("site/charts/ittai_itsukara/Ittai_itsukara_FINAL_notes.json"))
          # Audit every track so a blank GP track name cannot hide a wrong track selection.
          bars={x.attrib["id"]:x for x in root.find("Bars")}
          voices={x.attrib["id"]:x for x in root.find("Voices")}
          beats={x.attrib["id"]:x for x in root.find("Beats")}
          notes={x.attrib["id"]:x for x in root.find("Notes")}
          master_bars=list(root.find("MasterBars"))
          track_audit=[]
          for ti,t in enumerate(list(root.find("Tracks") or [])):
              frets=[]
              note_count=0
              for mb in master_bars:
                  bar_ids=(mb.findtext("Bars") or "").split()
                  if ti>=len(bar_ids): continue
                  bar=bars.get(bar_ids[ti])
                  if bar is None: continue
                  for voice_id in (bar.findtext("Voices") or "").split():
                      if voice_id=="-1" or voice_id not in voices: continue
                      for beat_id in (voices[voice_id].findtext("Beats") or "").split():
                          beat=beats.get(beat_id)
                          if beat is None: continue
                          for note_id in (beat.findtext("Notes") or "").split():
                              n=notes.get(note_id)
                              if n is None: continue
                              f=n.findtext("./Properties/Property[@name='Fret']/Fret")
                              m=n.findtext("./Properties/Property[@name='Midi']/Number")
                              val=f if f is not None else m
                              if val is not None:
                                  try: frets.append(int(val))
                                  except ValueError: pass
                              note_count+=1
              gm_like=sum(27<=x<=87 for x in frets)
              drum_core=sum(35<=x<=59 for x in frets)
              track_audit.append({
                  "index":ti,
                  "name":(t.findtext("Name") or "").strip(),
                  "shortName":(t.findtext("ShortName") or "").strip(),
                  "noteCount":note_count,
                  "fretOrMidiUnique":sorted(set(frets)),
                  "gmPercussionLikeCount":gm_like,
                  "coreDrumCount35to59":drum_core,
                  "coreDrumRatio":round(drum_core/max(1,len(frets)),4),
              })
          Path("site/charts/ittai_itsukara/track_audit.json").write_text(json.dumps(track_audit,ensure_ascii=False,indent=2)+"\n")
          # Print tempo and time-signature audit from the original GP score.
          tempos=[]
          for a in root.findall("./MasterTrack/Automations/Automation"):
              if a.findtext("Type")=="Tempo":
                  tempos.append({
                      "bar":a.findtext("Bar"),
                      "position":a.findtext("Position"),
                      "value":a.findtext("Value"),
                      "linear":a.findtext("Linear"),
                  })
          time_sigs=[]
          last=None
          for i,mb in enumerate(master_bars, start=1):
              sig=mb.findtext("Time")
              if sig!=last:
                  time_sigs.append({"measure":i,"time":sig})
                  last=sig
          drum_property_audit={}
          mismatch=[]
          for note_id,n in notes.items():
              fret=n.findtext("./Properties/Property[@name='Fret']/Fret")
              midi=n.findtext("./Properties/Property[@name='Midi']/Number")
              elem=n.findtext("./Properties/Property[@name='Element']/Element")
              variation=n.findtext("./Properties/Property[@name='Variation']/Variation")
              if fret is None and midi is None: continue
              key=str(fret if fret is not None else midi)
              slot=drum_property_audit.setdefault(key,{"count":0,"midiValues":{},"elementValues":{},"variationValues":{}})
              slot["count"]+=1
              if midi is not None: slot["midiValues"][midi]=slot["midiValues"].get(midi,0)+1
              if elem is not None: slot["elementValues"][elem]=slot["elementValues"].get(elem,0)+1
              if variation is not None: slot["variationValues"][variation]=slot["variationValues"].get(variation,0)+1
              if fret is not None and midi is not None and fret!=midi:
                  mismatch.append({"id":note_id,"fret":fret,"midi":midi,"element":elem,"variation":variation})
          print("DRUM_PROPERTY_AUDIT", json.dumps(drum_property_audit, ensure_ascii=False))
          print("FRET_MIDI_MISMATCH_COUNT", len(mismatch))
          Path("site/charts/ittai_itsukara/drum_property_audit.json").write_text(json.dumps({"byFret":drum_property_audit,"fretMidiMismatches":mismatch[:200]},ensure_ascii=False,indent=2)+"\n")
          print("TEMPO_AUDIT", json.dumps(tempos, ensure_ascii=False))
          print("TIME_SIGNATURE_AUDIT", json.dumps(time_sigs, ensure_ascii=False))
          Path("site/charts/ittai_itsukara/tempo_audit.json site/charts/ittai_itsukara/drum_property_audit.json").write_text(json.dumps({"tempos":tempos,"timeSignatures":time_sigs},ensure_ascii=False,indent=2)+"\n")
          selected=track_audit[chart["songsterrTrackIndex"]]
          if selected["coreDrumRatio"] < 0.9:
              raise SystemExit(f"Selected track does not look like drums: {selected}")
          metadata={
              "songsterrSongId":3705140,
              "songsterrRevisionId":chart["songsterrRevisionId"],
              "songsterrTrackIndex":chart["songsterrTrackIndex"],
              "sourceScoreBpm":chart["sourceScoreBpm"],
              "normalizedBpm":chart["bpm"],
              "measureCount":chart["measureCount"],
              "duration":chart["duration"],
              "tracks":tracks,
          }
          Path("site/charts/ittai_itsukara/source_metadata.json").write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(metadata,ensure_ascii=False))
          PY
      - name: Commit generated source metadata and FINAL chart
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/charts/ittai_itsukara/Ittai_itsukara_FINAL_notes.json site/charts/ittai_itsukara/source_metadata.json site/charts/ittai_itsukara/track_audit.json site/charts/ittai_itsukara/tempo_audit.json
          if git diff --cached --quiet; then
            echo "Ittai chart already up to date"
          else
            git commit -m "feat: add Ittai Itsukara FINAL drum chart source"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songsterr-ittai-public
          path: out
          if-no-files-found: error
