name: Runtime Pose Tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/runtime_pose/**'
      - '.github/workflows/runtime-pose-tests.yml'
  pull_request:
    paths:
      - 'tools/runtime_pose/**'
      - '.github/workflows/runtime-pose-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run runtime-pose unit tests
        run: python -m unittest discover -s tools/runtime_pose/tests -p 'test_*.py' -v
