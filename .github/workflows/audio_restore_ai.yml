name: Utsunomiya AI audio restore
on:
  push:
    branches: ["tmp/audio-restore-ai-20260927"]
    paths:
      - "temp/audio_input.b64.part*"
      - "temp/run_ai_restore.py"
      - "temp/model_trigger.txt"
      - ".github/workflows/audio_restore_ai.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: System info
        run: |
          set -euxo pipefail
          uname -a
          lscpu
          free -h
          df -h
          python --version
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
      - name: Install isolated AI inference stacks
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "numpy==1.26.4" soundfile scipy

          python -m venv sepvenv
          ./sepvenv/bin/python -m pip install --upgrade pip wheel setuptools
          ./sepvenv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0
          ./sepvenv/bin/python -m pip install "audio-separator[cpu]==0.47.0"

          python -m venv dfvenv
          ./dfvenv/bin/python -m pip install --upgrade pip setuptools
          # DeepFilterNet 0.5.6 imports torchaudio.backend.common, removed in newer torchaudio.
          # Pin a compatible pair only inside this isolated venv.
          ./dfvenv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchaudio==2.2.2
          ./dfvenv/bin/python -m pip install "deepfilternet==0.5.6" soundfile

          ./sepvenv/bin/python - <<'PY'
          import torch, numpy
          print('separator torch', torch.__version__, 'numpy', numpy.__version__, 'cuda?', torch.cuda.is_available())
          PY
          ./dfvenv/bin/python - <<'PY'
          import torch, torchaudio, numpy
          import df
          from torchaudio.backend.common import AudioMetaData
          print('deepfilter torch', torch.__version__, 'torchaudio', torchaudio.__version__, 'numpy', numpy.__version__, 'cuda?', torch.cuda.is_available())
          print('DeepFilterNet import and legacy backend API: OK')
          PY
          ./sepvenv/bin/audio-separator --version
          ./dfvenv/bin/deepFilter --help >/dev/null
      - name: Run actual AI restore
        env:
          AUDIO_SEPARATOR_MODEL_DIR: ${{ github.workspace }}/audio_ai_job/models
          SEP_BIN: ${{ github.workspace }}/sepvenv/bin/audio-separator
          DF_BIN: ${{ github.workspace }}/dfvenv/bin/deepFilter
        run: |
          set -o pipefail
          python temp/run_ai_restore.py 2>&1 | tee ai_restore_console.log
      - name: Upload result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utsunomiya-ai-restore
          path: |
            audio_ai_job/final
            audio_ai_job/logs
            audio_ai_job/models
            audio_ai_job/work
            audio_ai_job/analysis
            ai_restore_console.log
          retention-days: 3
