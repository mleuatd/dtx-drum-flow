name: Utsunomiya AI audio restore
on:
  push:
    branches: ["tmp/audio-restore-ai-20260927"]
    paths:
      - "temp/audio_input.b64.part*"
      - "temp/run_ai_restore.py"
      - "temp/model_trigger.txt"
      - ".github/workflows/audio_restore_ai.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System info
        run: |
          set -euxo pipefail
          uname -a
          lscpu
          free -h
          df -h
          python --version
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
      - name: Install real AI inference stacks
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel setuptools
          # CPU torch first so DeepFilterNet has the dependency that was missing in the previous attempt.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0
          python -m pip install "audio-separator[cpu]==0.47.0" "deepfilternet==0.5.6" soundfile numpy scipy
          python - <<'PY'
          import torch, torchaudio
          print('torch', torch.__version__, 'cuda?', torch.cuda.is_available())
          print('torchaudio', torchaudio.__version__)
          PY
          audio-separator --version
          deepFilter --help >/dev/null
      - name: Run actual AI restore
        env:
          AUDIO_SEPARATOR_MODEL_DIR: ${{ github.workspace }}/audio_ai_job/models
        run: |
          set -o pipefail
          python temp/run_ai_restore.py 2>&1 | tee ai_restore_console.log
      - name: Upload result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utsunomiya-ai-restore
          path: |
            audio_ai_job/final
            audio_ai_job/logs
            audio_ai_job/models
            audio_ai_job/work
            ai_restore_console.log
          retention-days: 3
