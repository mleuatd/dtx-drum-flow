name: Baseline version visual audit snapshot

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/baseline-version-audit-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check pillow reportlab

      - name: Extract current and baseline character layers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baseline-audit
          mkdir -p /tmp/baseline-audit/current /tmp/baseline-audit/baseline
          cp -a character-assets/layers/character /tmp/baseline-audit/current/character
          git archive a4e3854449e292264192afa63469edf0fb5048af character-assets/layers/character | tar -x -C /tmp/baseline-audit/baseline
          mv /tmp/baseline-audit/baseline/character-assets/layers/character /tmp/baseline-audit/baseline/character
          rm -rf /tmp/baseline-audit/baseline/character-assets

      - name: Build one-image-per-page full-resolution audit PDFs
        shell: bash
        run: |
          set -euo pipefail
          OUT="character-assets/prototypes/luna_say_maybe_16m/baseline-audit-snapshot-20260921"
          mkdir -p "$OUT"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader
          import json, hashlib, os

          out = Path("character-assets/prototypes/luna_say_maybe_16m/baseline-audit-snapshot-20260921")
          versions = {
              "current": (Path("/tmp/baseline-audit/current/character"), os.environ.get("GITHUB_SHA","")),
              "baseline": (Path("/tmp/baseline-audit/baseline/character"), "a4e3854449e292264192afa63469edf0fb5048af"),
          }
          manifest={"schemaVersion":1,"versions":{}}
          for vid,(root,commit) in versions.items():
              pngs=sorted(root.rglob("*.png"))
              pdf=out/f"{vid}_character_layers_fullres.pdf"
              c=canvas.Canvas(str(pdf), pagesize=(1448,1136), pageCompression=1)
              entries=[]
              for p in pngs:
                  rel=str(p.relative_to(root)).replace("\\","/")
                  data=p.read_bytes()
                  sha=hashlib.sha256(data).hexdigest()
                  with Image.open(p) as im:
                      w,h=im.size
                  entries.append({"path":rel,"width":w,"height":h,"sha256":sha})
                  c.setFont("Helvetica",11)
                  c.drawString(12,1116,f"{vid} | {commit} | {rel}")
                  c.drawImage(ImageReader(str(p)),0,20,width=1448,height=1086,preserveAspectRatio=True,anchor='c',mask='auto')
                  c.showPage()
              c.save()
              manifest["versions"][vid]={"commit":commit,"imageCount":len(entries),"images":entries,"pdf":str(pdf)}
          (out/"snapshot_manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          PY

      - name: Commit audit PDFs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-assets/prototypes/luna_say_maybe_16m/baseline-audit-snapshot-20260921
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "audit: add current vs baseline full-resolution PDFs"
          git push origin HEAD:main
