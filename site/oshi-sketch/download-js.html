<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScriptダウンロード</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;line-height:1.6}
a{display:inline-block;padding:12px 16px;border:1px solid #bbb;border-radius:10px;text-decoration:none;color:#111}
</style>
</head>
<body>
<h1>JavaScriptをダウンロード</h1>
<p id="msg">ダウンロードを開始しています。</p>
<a id="fallback" href="./app.js" download="oshi-sketch-app.js">開始しない場合はこちら</a>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('./app.js?download='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const blob=new Blob([text],{type:'application/javascript;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='oshi-sketch-app.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    msg.textContent='ダウンロードを開始しました。';
  }catch(e){
    msg.textContent='自動ダウンロードがブロックされました。下のリンクを押してください。';
  }
})();
</script>
</body>
</html>
