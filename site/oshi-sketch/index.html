<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>推しエピソード絵メーカー UI試作</title>
<style>
:root{--bg:#f4f4f5;--panel:#fff;--line:#d4d4d8;--text:#18181b;--muted:#71717a;--accent:#111827;}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px;background:#111827;color:#fff;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0} header p{font-size:12px;margin:4px 0 0;color:#d1d5db}
main{max-width:1400px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{font-size:16px;margin:0 0 10px}.label{font-weight:700;font-size:13px;margin:12px 0 6px;display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button{appearance:none;border:1px solid #c7c7cc;background:#fff;color:#111827;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;min-height:44px}
button.primary{background:#111827;color:#fff;border-color:#111827}
button:active{transform:translateY(1px)}
.sketchRow{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:10px;align-items:start}
.canvasWrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;touch-action:none}
.canvasWrap canvas{position:absolute;inset:0}
.canvasWrap::before{content:"";display:block;padding-top:100%}
.objectPane{border:1px solid var(--line);border-radius:12px;background:#fafafa;padding:8px}
.objectTitle{font-size:12px;font-weight:700;margin:0 0 8px}
.objectList{display:flex;flex-direction:column;gap:8px}
.objectBtn{padding:8px 6px;min-height:auto;font-size:12px;line-height:1.2}
.objectIcon{display:block;width:62px;height:70px;margin:0 auto 4px;background:#fff;border:1px solid #e4e4e7;border-radius:8px}
canvas{display:block;width:100%;height:100%;background:transparent;touch-action:none}
textarea,input{width:100%;font:inherit;border:1px solid #c7c7cc;border-radius:10px;padding:12px;background:#fff;color:#111827}
textarea{min-height:140px;resize:vertical;line-height:1.55}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.outputBox{min-height:300px;border:1px dashed #a1a1aa;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden}
.outputBox canvas{width:100%;height:auto}
.previewLayout{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:start}
.historyPane{border:1px solid var(--line);border-radius:12px;background:#fafafa;padding:8px}
.historyTitle{font-size:12px;font-weight:700;margin:0 0 8px;color:#3f3f46}
.historyList{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;padding-right:2px}
.historyItem{border:1px solid #d4d4d8;border-radius:10px;background:#fff;padding:6px;cursor:pointer}
.historyItem.active{outline:2px solid #111827}
.historyItem img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;border:1px solid #e4e4e7;background:#fff}
.historyMeta{font-size:11px;color:#71717a;margin-top:5px;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px}
.cleanPanel{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa}
.cleanGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cleanPanel select,.cleanPanel input[type="text"]{width:100%;font:inherit;border:1px solid #c7c7cc;border-radius:10px;padding:10px;background:#fff;color:#111827}
.rangeRow{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:8px}
.rangeRow input[type="range"]{width:100%}
.rangeLabel{font-size:11px;color:var(--muted);text-align:center}
.rangeValue{font-size:12px;font-weight:700;text-align:center;margin-top:4px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.modeBadge{display:inline-block;font-size:11px;border:1px solid #d4d4d8;border-radius:999px;padding:4px 8px;margin-right:6px;background:#fff}
@media(max-width:800px){
 main{grid-template-columns:1fr;padding:8px}
 header{position:static}
 .panel{border-radius:12px}
 button{flex:1 1 auto}
 textarea{min-height:120px}
 .cleanGrid{grid-template-columns:1fr}
 .previewLayout{grid-template-columns:1fr}
 .historyPane{order:2}
 .historyList{max-height:330px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow-y:auto}
 .sketchRow{grid-template-columns:minmax(0,1fr) 96px}
 .objectIcon{width:52px;height:60px}
}
</style>
</head>
<body>
<header>
  <h1>推しエピソード絵メーカー</h1>
  <p>UI試作版：ラフ構図＋文章 → 右側に完成イメージを出すための土台</p>
</header>
<main>
  <section class="panel">
    <h2>1. ラフ構図を描く</h2>
    <div class="toolbar">
      <button id="penBtn">ペン</button>
      <button id="eraserBtn">消しゴム</button>
      <button id="undoBtn">戻す</button>
      <button id="redoBtn">やり直す</button>
      <button id="clearBtn">全消去</button>
    </div>
    <div class="sketchRow">
      <div class="canvasWrap" id="canvasWrap">
        <canvas id="rough" width="800" height="800" aria-label="ラフ構図キャンバス"></canvas>
        <canvas id="objects" width="800" height="800" aria-label="オブジェクトレイヤー"></canvas>
      </div>
      <aside class="objectPane" aria-label="よく使うオブジェクト">
        <p class="objectTitle">よく使う</p>
        <div class="objectList">
          <button id="ojikaObjBtn" class="objectBtn" type="button">
            <canvas id="ojikaIcon" class="objectIcon" width="124" height="140"></canvas>
            小鹿さん
          </button>
          <button id="personObjBtn" class="objectBtn" type="button">
            <canvas id="personIcon" class="objectIcon" width="124" height="140"></canvas>
            人
          </button>
        </div>
      </aside>
    </div>
    <p class="hint">上手に描く必要はありません。人物の位置、向き、小物などを丸や線で雑に置く想定です。</p>

    <label class="label" for="description">2. 内容・状況を書く</label>
    <textarea id="description" placeholder="例：小鹿なおさんがLOOPに乗って犬を散歩。無表情で水平移動している感じ。"></textarea>

    <div class="cleanPanel">
      <strong>3. 清書設定</strong>
      <p class="hint"><span class="modeBadge">白黒固定</span><span class="modeBadge">手描き線固定</span>中央が現在の基準です。</p>

      <label class="label" for="finishRange">線の整い具合</label>
      <div class="rangeRow">
        <span class="rangeLabel">かなり雑</span>
        <input id="finishRange" type="range" min="0" max="100" value="50" step="1">
        <span class="rangeLabel">かなり整う</span>
      </div>
      <div id="finishValue" class="rangeValue" title="ダブルタップで50に戻す">50 / 基準</div>

      <div class="cleanGrid">
        <div>
          <label class="label" for="expressionPreset">表情</label>
          <select id="expressionPreset">
            <option value="default">デフォルト</option>
            <option value="void">虚無</option>
            <option value="void-max">虚無感マシマシ</option>
            <option value="smile">笑顔</option>
            <option value="surprised">驚き</option>
            <option value="custom">自由指定</option>
          </select>
        </div>
        <div>
          <label class="label" for="hairPreset">髪型</label>
          <select id="hairPreset">
            <option value="promo">デフォルト（宣材写真イメージ）</option>
            <option value="twin">ツインテール</option>
            <option value="pony">ひとつ結び</option>
            <option value="half">ハーフアップ</option>
            <option value="custom">自由指定</option>
          </select>
        </div>
      </div>

      <label class="label" for="cleanInstruction">清書への追加指示</label>
      <input id="cleanInstruction" type="text" placeholder="例：虚無感をもっと強く。目を細い線にする。犬は下手な落書きっぽく。">
    </div>

    <div class="actions">
      <button id="generateBtn" class="primary">清書する</button>
    </div>
  </section>

  <section class="panel">
    <h2>4. 完成プレビュー</h2>
    <div class="previewLayout">
      <div class="outputBox" id="outputBox">
        <canvas id="result" width="800" height="800"></canvas>
      </div>
      <aside class="historyPane" aria-label="差分履歴">
        <p class="historyTitle">差分履歴</p>
        <div id="historyList" class="historyList"></div>
      </aside>
    </div>

    <label class="label" for="revision">5. 修正指示</label>
    <textarea id="revision" placeholder="例：小鹿さんをもう少し中央へ。左の人物を小さく。吹き出しはいらない。"></textarea>
    <div class="actions">
      <button id="reviseBtn">修正を反映</button>
      <button id="saveBtn">PNG保存</button>
    </div>
    <p class="status" id="status">白黒・手描き固定。線の整い具合は中央50が現在の基準です。</p>
  </section>
</main>
<script src="./app.js"></script>
</body>
</html>
