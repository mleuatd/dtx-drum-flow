<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DTX Drum Flow</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">BROWSER DRUM TRAINER</p>
        <h1>DTX Drum Flow</h1>
      </div>
      <span class="badge">端末内で処理</span>
    </header>

    <section class="panel controls">
      <div class="file-row">
        <label class="button primary">
          譜面を開く
          <input id="chartFile" type="file" accept=".mid,.midi,.dtx,.gda" hidden>
        </label>
        <label class="button">
          元音源を開く
          <input id="audioFile" type="file" accept="audio/*" hidden>
        </label>
        <button id="loadSample" class="button">サンプル</button>
      </div>

      <div class="summary">
        <strong id="chartName">8ビート練習サンプル</strong>
        <span id="chartMeta">120 BPM · 13.0秒 · 87ノーツ</span>
      </div>

      <div class="timeline-row">
        <span id="currentTime">0:00.0</span>
        <input id="timeline" type="range" min="0" max="13" value="0" step="0.001">
        <span id="duration">0:13.0</span>
      </div>

      <div class="transport">
        <button id="rewind5" class="button">−5秒</button>
        <button id="playPause" class="button primary">再生 ▶</button>
        <button id="forward5" class="button">＋5秒</button>
      </div>

      <div class="settings-row">
        <label>速度
          <select id="speed">
            <option>0.5</option><option>0.75</option><option selected>1</option>
            <option>1.25</option><option>1.5</option><option>2</option>
          </select>×
        </label>
        <label class="check"><input id="drumOnly" type="checkbox"> ドラム音のみ</label>
        <button id="alignAudio" class="button" disabled>音源同期補正</button>
      </div>
    </section>

    <section class="stage panel">
      <canvas id="laneCanvas" aria-label="縦に流れるドラム譜面"></canvas>
      <div class="seek-zone left" aria-label="4小節戻る"></div>
      <div class="seek-zone right" aria-label="4小節進む"></div>
      <div id="parts" class="parts" aria-label="ドラムパート"></div>
    </section>

    <section class="panel status-panel">
      <h2>STATUS</h2>
      <p id="status">サンプルを読み込みました。再生を押すと始まります。</p>
    </section>

    <section class="panel help">
      <h2>QUICK START</h2>
      <p>「譜面を開く」から MIDI・DTX・GDA を選択。元音源がある場合は「元音源を開く」→「音源同期補正」で各ノーツの打点を元音源のアタックへ再アラインできます。</p>
      <p><strong>KEYBOARD</strong> Space: 再生/一時停止　← →: 5秒移動</p>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
