<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>DTX Drum Flow</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">DRUM PRACTICE</p>
        <h1>DTX Drum Flow</h1>
      </div>
      <span class="badge">Xperia向け</span>
    </header>

    <section class="quick panel">
      <button id="loadLuna" class="button primary huge">Luna say maybe 完成譜面を開く</button>
      <label class="button huge secondary">
        元音源を選ぶ
        <input id="audioFile" type="file" accept="audio/*" hidden>
      </label>
      <div class="summary">
        <strong id="chartName">8ビート練習サンプル</strong>
        <span id="chartMeta">120 BPM · 13.0秒 · 87ノーツ</span>
      </div>
    </section>

    <section class="stage panel">
      <div class="stage-head">
        <span>譜面</span>
        <span id="currentTime">0:00.0</span>
      </div>
      <canvas id="laneCanvas" aria-label="縦に流れるドラム譜面"></canvas>
      <div class="seek-zone left" aria-label="4小節戻る"></div>
      <div class="seek-zone right" aria-label="4小節進む"></div>
      <div id="parts" class="parts" aria-label="ドラムパート"></div>
    </section>

    <section class="timeline-card panel">
      <input id="timeline" type="range" min="0" max="13" value="0" step="0.001" aria-label="再生位置">
      <div class="time-row">
        <span>現在 <strong id="currentTimeMirror">0:00.0</strong></span>
        <span>終了 <strong id="duration">0:13.0</strong></span>
      </div>
    </section>

    <section class="mini-controls panel">
      <button id="rewind5" class="button">−5秒</button>
      <label>速度
        <select id="speed">
          <option>0.5</option><option>0.75</option><option selected>1</option>
          <option>1.25</option><option>1.5</option><option>2</option>
        </select>×
      </label>
      <button id="forward5" class="button">＋5秒</button>
    </section>

    <details class="panel advanced">
      <summary>詳細設定・ファイル操作</summary>
      <div class="advanced-body">
        <div class="file-grid">
          <label class="button">
            譜面ファイルを開く
            <input id="chartFile" type="file" accept=".mid,.midi,.dtx,.gda,.json" hidden>
          </label>
          <button id="loadSample" class="button">サンプル譜面</button>
          <button id="exportJson" class="button">譜面JSON保存</button>
        </div>
        <label class="check"><input id="drumOnly" type="checkbox"> ドラム音のみ</label>
        <button id="alignAudio" class="button" disabled>元音源にタイミング補正</button>
        <div id="dropZone" class="drop-hint">
          譜面・音源をドラッグ＆ドロップ
        </div>
      </div>
    </details>

    <section class="panel status-panel">
      <h2>状態</h2>
      <p id="status">「Luna say maybe 完成譜面を開く」を押してください。</p>
    </section>
  </main>

  <nav class="mobile-transport" aria-label="再生操作">
    <button id="rewindMeasure" class="transport-side">−4小節</button>
    <button id="playPause" class="transport-play">再生 ▶</button>
    <button id="forwardMeasure" class="transport-side">＋4小節</button>
  </nav>

  <script type="module" src="./app.js"></script>
</body>
</html>
